<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут проблемы — отдел разработки 1С</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="app-version" content="2026.08.29-1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EC; --card:#FFFDF7; --ink:#1E1B16; --ink-2:#5C5648; --line:#DCD5C3;
  --rose:#F2C4C9; --rose-deep:#C4626C; --mustard:#F6E28E; --mustard-deep:#9A7C31;
  --ok:#3F7A57; --warn:#B8801F; --alert:#C0453B; --blue:#3E6E9E;
  --headw:290px; --colw:196px;
  --laneh:96px; --headh:none;              /* высота строки заявки и карточки заявки */
  --card-fs:12px; --card-ff:inherit;       /* размер и семейство шрифта карточек */
  --c-new:#FFFDF7;  --c-new-b:#D2CCBB;
  --c-work:#FCF1BE;  --c-work-b:#CEC59B;
  --c-done:#E2F0DD;  --c-done-b:#B9C5B4;
  --shadow:0 1px 0 rgba(30,27,22,.06), 0 8px 20px -16px rgba(30,27,22,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Unbounded","Golos Text",sans-serif;font-weight:600;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- шапка ---------- */
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 20px;
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:"Unbounded",sans-serif;font-size:15px}
.brand span{font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.grow{flex:1}
.f-input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font:inherit;min-width:170px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:7px}
.badge-mode{font-size:11px;padding:4px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-2)}

/* ---------- матрица ---------- */
/* Доска — собственная область прокрутки: только так шапка колонок может липнуть сверху.
   Раньше overflow-x:auto делал .matrix прокруткой и по вертикали, страница скроллилась мимо,
   и position:sticky у шапки ни к чему не прилипал. */
.matrix{overflow:auto;padding-bottom:40px}
.mrow{display:grid;grid-template-columns:var(--headw) repeat(6,minmax(var(--colw),1fr));
      min-width:calc(var(--headw) + 6*var(--colw))}
.cell{padding:0 6px}
.stick{position:sticky;left:0;z-index:12;background:var(--paper);border-right:1px solid var(--line)}

.mhead{position:sticky;top:0;z-index:30;background:var(--paper);box-shadow:0 1px 0 var(--line),0 6px 12px -10px rgba(30,27,22,.5)}
.mhead .stick{background:var(--paper);z-index:32}
.mhead .cell{padding:10px 12px;border-right:1px solid var(--line)}
.mhead .cell:last-child{border-right:0}
.sh{display:flex;gap:8px;align-items:baseline}
.step-no{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;width:20px;height:20px;flex:0 0 20px;
  border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center}
.sh h3{margin:0;font-size:13px;line-height:1.25}
.sh-res{font-size:10.5px;color:var(--ink-2);font-style:italic;margin-top:3px}
.sh-norm{font-size:10.5px;color:var(--ink-2);margin-top:3px}
.mhead.compact .cell{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px}
.mhead.compact .sh-res,.mhead.compact .sh-norm{display:none}
.mhead.compact .sh-sp{margin-top:0}
.mhead.compact .sh h3{font-size:12.5px}
.headtog{border:0;background:none;padding:0;margin:0;font-size:10.5px;color:var(--blue);
  text-decoration:underline;cursor:pointer;white-space:nowrap}
.sh-sp{font-size:11px;margin-top:5px;padding:2px 6px;border-radius:999px;display:inline-block;
  background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.sh-sp.zero{color:var(--ink-2);border-style:dashed}
.sh-sp b{font-family:"JetBrains Mono",monospace}
.hint{font-size:11px;color:var(--ink-2)}

/* ---------- строка заявки ---------- */
.matrix{overflow:auto;padding:0 20px 28px;max-height:calc(100vh - var(--topgap, 120px));overscroll-behavior:contain}
.spbar{position:sticky;left:0}
.mtable{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);
        min-width:calc(var(--headw) + 6*var(--colw))}
.lane{border-top:1px solid var(--line)}
.lane .cell{border-right:1px solid var(--line);padding:8px;background:var(--card);min-height:var(--laneh)}
.lane .cell:last-child{border-right:0}
.lane .cell.stick{background:var(--paper)}
.lane .cell.off{background:repeating-linear-gradient(135deg,transparent,transparent 7px,rgba(30,27,22,.045) 7px,rgba(30,27,22,.045) 8px)}
.lane .cell.off span{font-size:10.5px;color:var(--ink-2);opacity:.7}
.lane-head{padding:12px 12px;font-family:var(--card-ff)}
.hcbox{max-height:var(--headh);overflow:auto}
.hcbox::-webkit-scrollbar{width:6px}
.hcbox::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.lane-head .id{font-family:"JetBrains Mono",monospace;font-size:calc(var(--card-fs) - 1.5px);color:var(--ink-2)}
.lane-head h4{margin:1px 0 6px;font-size:calc(var(--card-fs) + 1.5px);font-weight:600;line-height:1.3;cursor:pointer}
.lane-head h4:hover{text-decoration:underline}
.chip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.chip.cat-new{background:#EAF1E9;border-color:#BFD4BE}
.chip.cat-bug{background:#FAE3E1;border-color:#EDC0BC}
.chip.cat-setup{background:#FFF3D6;border-color:#EBD7A0}
.chip.cat-consult{background:#E7EEF6;border-color:#C3D3E5}
.chip.cat-c1{background:#EFE8F3;border-color:#D2C2DD}
.chip.cat-c2{background:#E6F1EF;border-color:#BBD7D1}
.chip.cat-c3{background:#F4EDE3;border-color:#DFCDB4}
.linkbtn{border:0;background:none;padding:0;margin:2px 0 0;font-size:11.5px;color:var(--blue);
  text-decoration:underline;cursor:pointer}
.prog{font-size:calc(var(--card-fs) - 1px);color:var(--ink-2);margin-top:8px}
.prog b{font-family:"JetBrains Mono",monospace;color:var(--ink)}
.minibar{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:7px;margin-top:8px}
.minibar i{border:1px solid var(--line);border-radius:2px}
.minibar i.done{background:var(--rose-deep);border-color:var(--rose-deep)}
.minibar i.current{background:var(--rose);border-color:var(--rose-deep)}
.minibar i.skip{border-style:dotted;opacity:.45}

/* ---------- задача в ячейке ---------- */
.scard{background:var(--c-new);border:1px solid var(--c-new-b);border-left-width:4px;border-radius:8px;
        padding:8px 9px;margin-bottom:6px;cursor:grab;font-family:var(--card-ff)}
.scard.work{background:var(--c-work);border-color:var(--c-work-b)}
.scard.done{background:var(--c-done);border-color:var(--c-done-b)}
.scard.new{border-style:dashed}
.scard.dragging{opacity:.4}
.scard .t{font-size:var(--card-fs);font-weight:600;line-height:1.25}
.scard .m{font-size:calc(var(--card-fs) - 1.5px);color:var(--ink-2);margin-top:4px}
.scard .acts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.who-sel{font:inherit;font-size:calc(var(--card-fs) - 1.5px);border:1px solid var(--line);background:var(--card);border-radius:5px;padding:1px 4px;max-width:120px}
.who-sel:disabled{opacity:.7;background:transparent;border-color:transparent}
.addbtn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink-2);
        border-radius:8px;padding:6px;cursor:pointer;font-size:11.5px}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.cell.drop-ok{outline:2px dashed var(--blue);outline-offset:-3px}
.spbar{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;margin:12px 0 6px;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rose-deep);border-radius:10px;font-size:13px}
.spbar b{font-size:15px}
.spbar .dim,.spbar.dim{color:var(--ink-2);font-size:12px}
.group-title{padding:14px 20px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  position:sticky;left:0;background:var(--paper);z-index:14}
.empty{padding:24px 20px;color:var(--ink-2);font-size:13px}

/* ---------- панель ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,27,22,.35);z-index:50}
.drawer.wide{width:min(1100px,100%)}
.colorpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:10px}
.cp{display:flex;gap:9px;align-items:center;font-size:13px;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cp input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px;cursor:pointer}
.spin{width:52px;font:inherit;font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:2px 4px;text-align:right}
.listtab{border-collapse:collapse;width:100%;font-size:12px}
.listtab th{position:sticky;top:0;background:var(--paper);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);white-space:nowrap}
.listtab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.listtab tr.lead td{background:var(--paper);font-weight:600}
.listtab tbody tr{cursor:pointer}
.listtab tbody tr:hover td{background:rgba(62,110,158,.08)}
.listtab th[data-sort]{cursor:pointer;user-select:none}
.listtab th[data-sort]:hover{color:var(--ink);text-decoration:underline}
.listtab th.sorted{color:var(--ink)}
.listtab td.pick,.listtab th.pick{width:28px;text-align:center;cursor:default}

/* ---------- живой ход работы ---------- */
.progpanel{position:fixed;right:16px;bottom:16px;z-index:80;width:min(420px,calc(100% - 32px));
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;
  box-shadow:var(--shadow);padding:10px 12px;font-size:12px}
.progpanel h6{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.progpanel ol{margin:0;padding:0;list-style:none;max-height:190px;overflow:auto}
.progpanel li{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line);line-height:1.35}
.progpanel li:last-child{border-bottom:0}
.progpanel li.cur{font-weight:600}
.progpanel .ms{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-2);margin-left:auto;white-space:nowrap}
.progpanel .tot{margin-top:6px;font-size:11px;color:var(--ink-2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);
  border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .body{padding:16px 20px 30px;overflow-y:auto;flex:1}
.drawer h2{font-size:16px;margin:6px 0 8px}
.sec{margin-top:22px}
.sec>h5{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.trow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;
      background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px}
.trow.done{background:var(--c-done);border-color:var(--c-done-b)}
.trow.work{background:var(--c-work);border-color:var(--c-work-b)}
.trow.new{background:var(--c-new);border-color:var(--c-new-b)}
.trow .n{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600}
.check{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.chat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px}
.msg{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.msg:last-child{border-bottom:0}
.msg b{font-size:11px;color:var(--ink-2)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{font-size:12px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--rose-deep);padding:8px 10px;border-radius:0 6px 6px 0;margin-top:10px}

/* ---------- страница настроек ---------- */
.settings{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.settings > label{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.fieldpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 14px;margin-bottom:10px}
.fp{display:flex;gap:8px;align-items:center;font-size:13px;margin:0;padding:5px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.fp.on{background:var(--paper);border-color:var(--line)}
.preview{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:var(--paper)}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.catcard .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.catcard .head input.name{font:inherit;font-weight:600;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:220px}
.catcard .head input.name:hover,.catcard .head input.name:focus{border-color:var(--line);background:var(--paper)}
.stagepick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.spick{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--paper)}
.spick.on{background:var(--rose);border-color:var(--rose-deep)}
.spick .sn{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-2)}
.spick .snm{font-size:11.5px;font-weight:600;line-height:1.2;margin-top:2px}
.spick select{width:100%;margin-top:6px;font:inherit;font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:2px;background:var(--card)}
.modepick{display:flex;gap:6px}
.modepick button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
.modepick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.routeline{font-size:12px;color:var(--ink-2);margin-top:10px}

/* ---------- страницы ---------- */
.page{padding:22px 24px 60px;max-width:1100px}
.page h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--paper)}
tr:last-child td{border-bottom:0}
td.num{width:34px;font-family:"JetBrains Mono",monospace;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.person .role{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.person b{display:block;margin:2px 0 8px;font-size:14px}
.person ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.lvl{float:right;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:70}
@media (max-width:640px){:root{--headw:180px;--colw:150px}}
</style>
</head>
<body>

<header class="top">
  <div class="brand" id="brand"><b>Маршрут проблемы</b><span>Отдел разработки 1С</span></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="board">Доска</button>
    <button role="tab" aria-selected="false" data-view="routes">Настройки</button>
    <button role="tab" aria-selected="false" data-view="reglament">Регламент</button>
    <button role="tab" aria-selected="false" data-view="team">Команда</button>
  </div>
  <div class="grow"></div>
  <input class="f-input" id="q" placeholder="Поиск по проблемам" aria-label="Поиск">
  <select class="f-input" id="fProject" aria-label="Проект"></select>
  <select class="f-input" id="fSprint" aria-label="Спринт"></select>
  <select class="f-input" id="fUser" aria-label="Исполнитель"></select>
  <button class="btn ghost small" id="refreshBtn" title="Перечитать задачи портала">Обновить</button>
  <button class="btn ghost small" id="listBtn" title="Плоский список задач по текущему отбору">Сформировать список задач</button>
  <button class="btn ghost small" id="sprintBtn" title="Задачи исполнителей текущего спринта, созданные в его период и не попавшие в спринт">Добавить задачи в спринт</button>
  <button class="btn ghost small" id="viewToggle" title="Свернуть или развернуть строки"></button>
  <button class="btn" id="addBtn">Новая заявка</button>
  <span class="badge-mode" id="mode">режим не определён</span>
</header>

<main id="app"></main>
<div id="layer"></div>
<div id="progress" class="progpanel" hidden></div>

<script src="//api.bitrix24.com/api/v1/" onerror="window.__bxFail=true"></script>
<script>
/* =====================================================================
   Регламент выполнения заявки → матрица «заявка пользователя × стадии».
   Строка — заявка пользователя (проблема), растянутая полоской по всем шести
   стадиям. Колонка — стадия регламента. Внутри строки — дерево подзадач,
   каждая стоит в колонке своей стадии. Полоска закрашивается только
   завершёнными подзадачами.
   ===================================================================== */

/* Версия сборки: видна в подсказке к названию, в настройках и в журнале —
   по ней сразу понятно, какую версию отдал хостинг после деплоя. */
const APP_VERSION='2026.08.29-1';

const CONFIG = {
  storage:'xmlid',                // 'xmlid' — метка в XML_ID (поля TAGS у задач нет), 'uf' — свои поля
  ufStage:'UF_AUTO_STAGE',
  ufCategory:'UF_AUTO_CATEGORY',
  groupId:0,                      // ID скрам-проекта, 0 — все задачи
  mergeFirstThree:false,          // этапы 1–3 одной подзадачей с чек-листом
  autoCreateRoute:true,           // после выбора категории создавать подзадачи на все этапы маршрута
  createOnIntake:'first',         // при приёме заявки: 'first' — только анализ, 'all' — весь маршрут
  headFields:['id','cat','minibar','progress','current','effort','sp','ensure'],
  headMode:'full',                // 'full' — обычный вид строки, 'compact' — только наименование
  headerMode:'full',              // шапка колонок: 'full' — с результатом и нормативом, 'compact' — номер, название, СП
  cardType:'std',                 // 'std' — типовая карточка, 'custom' — пользовательская

const Log={
  key:'bx_scrum_log', items:[],
  add(kind, text, extra){
    const rec={ts:Date.now(), kind, text, extra:extra||null,
                who:(state.me&&state.me.name)||'', group:state.group||'', sprint:state.sprint||''};
    this.items.push(rec);
    const lim=Number(CONFIG.logLimit)||300;
    if(this.items.length>lim) this.items=this.items.slice(-lim);
    if(kind==='error') console.warn('[журнал]',text,extra||''); else console.log('[журнал]',text);
    this.save();
    return rec;
  },
  /* Запись откладывается на полсекунды: при загрузке журнал пополняется десятками строк,
     и сериализация всего массива на каждой строке заметно тормозила формирование списка. */
  save(now){
    if(!CONFIG.logSave) return;
    if(!now){ clearTimeout(this._t); this._t=setTimeout(()=>this.save(true),500); return; }
    try{ localStorage.setItem(this.key, JSON.stringify(this.items)); }catch(e){}
    try{ if(window.BX24 && BX24.userOption) BX24.userOption.set(this.key, JSON.stringify(this.items.slice(-100))); }catch(e){}
  },
  load(){
    if(!CONFIG.logSave) return;
    try{ const v=localStorage.getItem(this.key); if(v){ this.items=JSON.parse(v)||[]; return; } }catch(e){}
    try{ if(window.BX24 && BX24.userOption){ const v=BX24.userOption.get(this.key); if(v) this.items=JSON.parse(v)||[]; } }catch(e){}
  },
  clear(){ this.items=[];
    try{ localStorage.removeItem(this.key); }catch(e){}
    try{ if(window.BX24 && BX24.userOption) BX24.userOption.set(this.key,''); }catch(e){}
  },
  csv(){
    const rows=[['время','тип','действие','подробности','сотрудник','проект','спринт']]
      .concat(this.items.map(r=>[dtime(r.ts), r.kind, r.text,
                                 r.extra?Object.entries(r.extra).map(([k,v])=>k+': '+v).join(', '):'',
                                 r.who, projectName(r.group), r.sprint?sprintName(r.sprint):'']));
    return toCsv(rows);
  }
};

   • поля запроса в ВЕРХНЕМ регистре, в ответе приходят camelCase;

   • спринт и стадия скрама лежат прямо в задаче: sprintId, stageId;

   • статусы: 2 ждёт, 3 выполняется, 4 ожидает контроля, 5 завершена, 6 отложена.

const TASK_SELECT_BASE=['ID','TITLE','DESCRIPTION','PARENT_ID','RESPONSIBLE_ID','STATUS','GROUP_ID',

/* Русские подписи типовых реквизитов задачи — для конструктора пользовательской карточки */

};
/* Список полей для конструктора: с портала, если он на связи, иначе типовой минимум */
function portalFieldList(){
  const out=[];
  const f=state.taskFields;
  if(f && typeof f==='object'){
    Object.entries(f).forEach(([name,d])=>{
      const title=(d&&(d.title||d.TITLE))||STD_FIELD_RU[name]||name;
      out.push({name, title:String(title), uf:/^UF_/.test(name), type:(d&&(d.type||d.TYPE))||''});
    });
  }else{
    Object.entries(STD_FIELD_RU).forEach(([name,title])=>out.push({name,title,uf:false,type:''}));
  }
  out.sort((a,b)=>(a.uf===b.uf?a.title.localeCompare(b.title,'ru'):(a.uf?1:-1)));
  return out;
}
const fieldLabel=name=>{
  const f=portalFieldList().find(x=>x.name===name);
  return f?f.title:(STD_FIELD_RU[name]||name);
};
/* Значение поля задачи для карточки: даты, объекты-люди, массивы и числа приводятся к читаемому виду */
function fieldValue(pr, name){
  const t=pr&&pr.raw; if(!t) return '';
  let v=t[BX.camel(name)];
  if(v===undefined) v=t[name];
  if(v===undefined||v===null||v==='') return '';
  if(Array.isArray(v)) return v.map(x=>(x&&(x.name||x.title))||x).join(', ');
  if(typeof v==='object') return String(v.name||v.title||v.id||'');
  const str=String(v);
  if(/^\d{4}-\d{2}-\d{2}T/.test(str)) return ddate(new Date(str).getTime());
  if(name==='STATUS') return {'1':'новая','2':'ждёт выполнения','3':'выполняется','4':'ждёт контроля','5':'завершена','6':'отложена'}[str]||str;
  if(name==='GROUP_ID') return projectName(str);
  if(name==='SPRINT_ID') return str&&str!=='0'?sprintName(str):'бэклог';
  if(name==='RESPONSIBLE_ID'||name==='CREATED_BY') return person('u'+str).name;
  if(name==='TIME_ESTIMATE'||name==='TIME_SPENT_IN_LOGS') return hours(Number(str)/3600);
  return str;
}

const BX = {
  ready:false,
  /* На портале result.error_description — ФУНКЦИЯ, а не строка: без разбора
     в журнал попадал исходник функции вместо текста ошибки. */
  errorText(r){
    try{
      const e=r.error();
      if(!e) return 'неизвестная ошибка';
      if(typeof r.error_description==='function'){ const d=r.error_description(); if(d) return String(d); }
      if(typeof e==='string') return e;
      if(typeof e==='function'){ const d=e(); return typeof d==='string'?d:JSON.stringify(d); }
      if(e.error_description) return String(e.error_description);
      if(e.ex) return String(e.ex.error_description||e.ex.error||JSON.stringify(e.ex));
      if(e.error) return String(e.error);
      return JSON.stringify(e);
    }catch(x){ return 'ошибка не разобрана'; }
  },
  callRaw(method, params){
    const t0=Date.now();
    return new Promise((res,rej)=>{
      if(!this.ready) return rej(new Error('BX24 недоступен'));
      BX24.callMethod(method, params||{}, r=>{
        const ms=Date.now()-t0;
        if(r.error()){
          const msg=this.errorText(r);
          Log.add('error','REST '+method+': '+msg, {параметры:JSON.stringify(params||{}).slice(0,300), мс:ms});
          return rej(new Error(msg));
        }
        if(CONFIG.logVerbose){
          const d=r.data(); const n=Array.isArray(d)?d.length:(d&&d.tasks?d.tasks.length:(d&&typeof d==='object'?Object.keys(d).length:1));
          let total=null; try{ total=r.total?r.total():null; }catch(e){}
          Log.add('api','REST '+method, {параметры:JSON.stringify(params||{}).slice(0,300),
                                         получено:n, всего:total==null?'—':total, мс:ms});
        }
        res(r);
      });
    });
  },
  async call(method, params){ return (await this.callRaw(method, params)).data(); },

  /* Пакет: до 50 команд одним HTTP-запросом вместо 50 отдельных. */
  callBatch(cmds){
    const keys=Object.keys(cmds);
    if(!keys.length) return Promise.resolve({});
    const t0=Date.now();
    return new Promise((res,rej)=>{
      if(!this.ready) return rej(new Error('BX24 недоступен'));
      try{
        BX24.callBatch(cmds, r=>{
          const out={};
          keys.forEach(k=>{
            const item=r&&r[k];
            try{ out[k]= item && !item.error() ? item.data() : null; }catch(e){ out[k]=null; }
          });
          if(CONFIG.logVerbose)
            Log.add('api','REST пакет: команд '+keys.length, {мс:Date.now()-t0});
          res(out);
        });
      }catch(e){ rej(e); }
    });
  },
  toArray(r){
    if(!r) return [];
    if(Array.isArray(r)) return r;
    for(const k of ['tasks','sprints','items','result','list']) if(Array.isArray(r[k])) return r[k];
    const v=Object.values(r);
    return v.length && typeof v[0]==='object' ? v : [];
  },
  num(v){ return Number(v||0)||0; },
  d(s){ return s?String(s).slice(0,10).split('-').reverse().slice(0,2).join('.'):''; },

  /* --- метка этапа и категории: поля TAGS на портале нет, пишем в XML_ID --- */
  camel(uf){ return String(uf||'').toLowerCase().replace(/_([a-z0-9])/g,(m,c)=>c.toUpperCase()); },
  parseXml(src){
    const o={}, re=/bxs:(\w+)=([\w.-]*)/g; let m;
    while((m=re.exec(String(src||'')))) o[m[1]]=m[2];
    return o;
  },
  /* этап, категория, сторипоинты и процент: из польз. полей, если заданы, иначе из метки в XML_ID */
  marker(t){
    const src = CONFIG.storage==='uf' && t[CONFIG.ufStage]!=null
      ? 'bxs:stage='+t[CONFIG.ufStage]+';bxs:cat='+(t[CONFIG.ufCategory]||'')
      : (t.xmlId||t.XML_ID||'');
    const o=this.parseXml(src);
    const uf=k=>{ const f=CONFIG[k]; if(!f) return null;
      const v = t[this.camel(f)]!==undefined ? t[this.camel(f)] : t[f];
      return (v===undefined||v===null||v==='')?null:v; };
    const sp=uf('spField')!=null?uf('spField'):(o.sp!=null?o.sp:null);
    const pct=uf('pctField')!=null?uf('pctField'):(o.pct!=null?o.pct:null);
    return {stage:o.stage!=null?Number(o.stage):null, cat:o.cat||null,
            sp: sp==null?null:(Number(sp)||0), pct: pct==null?null:(Number(pct)||0)};
  },
  stageOf(t){
    const m=this.marker(t);
    if(m.stage!=null) return m.stage;
    const byTitle=/Этап\s*(\d)/.exec(t.title||'');
    return byTitle?Number(byTitle[1]):0;
  },
  catOf(t){
    const m=this.marker(t);
    return (m.cat && CATEGORIES[m.cat]) ? m.cat : Object.keys(CATEGORIES)[0];
  },
  buildXmlId(oldXml, patch){
    const cur=Object.assign(this.parseXml(oldXml), patch||{});
    const rest=String(oldXml||'').replace(/bxs:\w+=[\w.-]*/g,'').replace(/[;\s]+/g,' ').trim();
    const parts=Object.entries(cur)
      .filter(([k,v])=>v!==null&&v!==undefined&&v!=='')
      .map(([k,v])=>'bxs:'+k+'='+v);
    return (rest?rest+' ':'')+parts.join(';');
  },
  setMarker(task, patch){
    const fields={};
    const xml=Object.assign({},patch);
    if(CONFIG.spField && patch.sp!==undefined){ fields[CONFIG.spField]=patch.sp; delete xml.sp; }
    if(CONFIG.pctField && patch.pct!==undefined){ fields[CONFIG.pctField]=patch.pct; delete xml.pct; }
    if(CONFIG.storage==='uf'){
      if(xml.stage!==undefined) fields[CONFIG.ufStage]=xml.stage;
      if(xml.cat!==undefined) fields[CONFIG.ufCategory]=xml.cat||'';
      delete xml.stage; delete xml.cat;
    }
    if(Object.keys(xml).length) fields.XML_ID=this.buildXmlId(task.xmlId, xml);
    return this.call('tasks.task.update',{taskId:Number(task.bxId), fields});
  },

  /* --- статус задачи → шаг внутри этапа --- */
  status(v){
    const n=this.num(v);
    if(n===5) return 'done';
    if(n===3||n===4) return 'work';
    return 'new';
  },

  /* --- задачи проекта одним запросом, родители и подзадачи разбираем на клиенте --- */
  /* Внимание: next/total приходят в конверте ответа, а не внутри data().
     Раньше чтение обрывалось на первой странице — берём страницы по явному смещению start. */
  async loadTasks(filterIn, label, onPage){
    const filter=Object.assign({}, filterIn||{});
    const PAGE=50;
    let start=0, all=[], pages=0, total=null, seen=new Set();
    for(let page=0; page<40; page++){
      const res=await this.callRaw('tasks.task.list',{filter, select:taskSelect(), start});
      const arr=this.toArray(res.data());
      pages++;
      let fresh=0;
      arr.forEach(x=>{ const id=String(x.id); if(!seen.has(id)){ seen.add(id); all.push(x); fresh++; } });
      try{ const tt=res.total?res.total():null; if(tt!=null) total=Number(tt); }catch(e){}
      Log.add('page','Страница задач '+pages+': получено '+arr.length+', новых '+fresh,
              {смещение:start, всего:total==null?'—':total, отбор:JSON.stringify(filter)});
      Progress.step('Читаю задачи ('+(label||'отбор')+'): страница '+pages+', получено '+all.length
        +(total!=null?' из '+total:''));
      if(onPage){ try{ onPage(all.slice(), pages, total); }catch(e){} }
      if(arr.length<PAGE) break;
      start+=arr.length;
      if(total!=null && all.length>=total) break;
    }
    this.lastLoad={pages, got:all.length, total, label:label||''};
    console.log('[задачи] страниц:',pages,'получено:',all.length,'всего по порталу:',total, label||'');
    return all;
  },
  /* Подзадача должна попасть в тот же проект и спринт, иначе на скрам-доске её не видно.
     SPRINT_ID и GROUP_ID принимает не каждый портал — при отказе повторяем без них. */
  async addSubtask(parentId, title, responsibleId, estimateH, stage, cat, groupId, sprintId){
    const base={TITLE:title, PARENT_ID:Number(parentId), RESPONSIBLE_ID:Number(responsibleId)||1,
                TIME_ESTIMATE:Math.round((estimateH||1)*3600),
                XML_ID:this.buildXmlId('', {stage, cat})};
    const full=Object.assign({}, base);
    if(groupId) full.GROUP_ID=Number(groupId);
    if(sprintId) full.SPRINT_ID=Number(sprintId);
    try{
      const r=await this.call('tasks.task.add',{fields:full});
      Log.add('task','Подзадача создана в портале',{задача:r.task&&r.task.id,
        проект:full.GROUP_ID||'—', спринт:full.SPRINT_ID||'—'});
      return r;
    }catch(e){
      Log.add('error','Создание с проектом и спринтом отклонено: '+e.message+'. Повтор без них.',
              {поля:Object.keys(full).join(', ')});
      const r=await this.call('tasks.task.add',{fields:base});
      Log.add('task','Подзадача создана без привязки к спринту — на скрам-доске её нужно перетащить вручную',
              {задача:r.task&&r.task.id});
      return r;
    }
  },
  complete(taskId){ return this.call('tasks.task.complete',{taskId:Number(taskId)}); },
  start(taskId){ return this.call('tasks.task.start',{taskId:Number(taskId)}); },
  setResponsible(taskId,userId){ return this.call('tasks.task.update',{taskId:Number(taskId),fields:{RESPONSIBLE_ID:Number(userId)||1}}); },
  comment(taskId,text){ return this.call('task.commentitem.add',[Number(taskId),{POST_MESSAGE:text}]); },

  /* Старт одним запросом: поля, текущий пользователь и список проектов. */
  async bootData(){
    const cmds={
      fields:['tasks.task.getFields',{}],
      me:['user.current',{}],
      groups:['sonet_group.get',{}],
      wg:['socialnetwork_api.workgroup.list',{select:['ID','NAME','IS_SCRUM_PROJECT']}]
    };

    const wg=this.toArray(r.wg).map(g=>g.workgroup||g);
    const src=wg.length?wg:this.toArray(r.groups);
    out.projects=src.map(g=>{
      const f=g.isScrumProject!==undefined?g.isScrumProject:g.IS_SCRUM_PROJECT;
      return {id:String(g.id||g.ID), name:g.name||g.NAME,
              scrum: f===undefined?null:(f===true||f==='Y'||f===1||f==='1')};
    }).filter(g=>g.id&&g.name);
    return out;
  },

  /* --- проекты --- */
  async loadProjects(){
    try{
      const r=await this.call('socialnetwork_api.workgroup.list',{select:['ID','NAME','IS_SCRUM_PROJECT']});
      const arr=this.toArray(r).map(g=>g.workgroup||g);
      const out=arr.map(g=>{
        const f=g.isScrumProject!==undefined?g.isScrumProject:g.IS_SCRUM_PROJECT;
        return {id:String(g.id||g.ID), name:g.name||g.NAME,
                scrum: f===undefined?null:(f===true||f==='Y'||f===1||f==='1')};
      }).filter(g=>g.id&&g.name);
      if(out.length) return out;
      throw new Error('пустой список');
    }catch(e){
      console.warn('[проекты] workgroup.list:', e.message);
      const r=await this.call('sonet_group.get',{});
      return this.toArray(r).map(g=>({id:String(g.ID||g.id), name:g.NAME||g.name, scrum:null}));
    }
  },

  /* --- сторипоинты скрама: живут в скрам-задаче (tasks.api.scrum.task), а не в самой задаче ---
     Разобрано по выгрузке структуры портала от 29.08.2026 и справочнику REST:
     • tasks.api.scrum.task.get принимает параметр id, а НЕ taskId. На taskId портал отвечает
       «Task not found», поэтому оценок не было видно вообще — ни одной, при том что в задачах они есть;
     • метода tasks.api.scrum.task.list не существует (Method not found) — берём только пакетами по get;
     • storyPoints приходит строкой ("8", "2.5"), иногда с запятой;
     • ответ get — плоский объект {entityId, storyPoints, epicId, sort, createdBy, modifiedBy}. */
  spNum(v){
    if(v===null||v===undefined||v==='') return 0;
    const n=Number(String(v).replace(',','.').trim());
    return isNaN(n)?0:n;
  },
  spFromAnswer(v){
    if(!v||typeof v!=='object') return 0;
    if(v.storyPoints!==undefined) return this.spNum(v.storyPoints);
    if(v.story_points!==undefined) return this.spNum(v.story_points);
    for(const k of ['result','task','item','data']) if(v[k]&&typeof v[k]==='object'){
      const n=this.spFromAnswer(v[k]); if(n) return n;
    }
    return 0;
  },
  async loadScrumPoints(ids){
    const out={};
    state.spCache=state.spCache||{};
    const now=Date.now(), TTL=5*60*1000;
    const want=[...new Set((ids||[]).map(String))].filter(Boolean), ask=[];
    want.forEach(id=>{ const c=state.spCache[id];
      if(c && now-c.ts<TTL){ if(c.sp) out[id]=c.sp; } else ask.push(id); });
    if(!ask.length){ Log.add('load','Сторипоинты взяты из кэша: '+Object.keys(out).length+' задач'); return out; }
    return await this.scrumPointsBatch(ask, out);
  },
  /* поштучно, но пакетами по 50 команд: 200 задач — четыре запроса, а не двести */
  async scrumPointsBatch(ask, out){
    out=out||{};
    const list=ask.slice(0,300), t0=Date.now();
    let asked=0, found=0, sample=null;
    for(let i=0;i<list.length;i+=50){
      const chunk=list.slice(i,i+50), cmds={};
      chunk.forEach(id=>{ cmds['t'+id]=['tasks.api.scrum.task.get',{id:Number(id)}]; });
      let part;
      try{ part=await this.callBatch(cmds); }
      catch(e){ Log.add('error','Сторипоинты скрама недоступны: '+e.message); break; }
      asked+=chunk.length;
      let got=0;
      Object.entries(part).forEach(([k,v])=>{
        if(sample===null && v) sample=JSON.stringify(v).slice(0,200);
        const sp=this.spFromAnswer(v);
        if(sp){ out[k.slice(1)]=sp; got++; }
      });
      found+=got;
      Progress.step('Сторипоинты: спрошено '+asked+' задач, с оценкой '+found);
      /* пустой первый пакет — метод молчит на все задачи, дальше не долбим */
      if(i===0 && !got && Object.values(part).every(v=>v===null||v===undefined)) break;
    }
    const now=Date.now();
    list.forEach(id=>{ state.spCache[id]={sp:out[id]||0, ts:now}; });
    Log.add('load','Сторипоинты из скрам-задач: спрошено '+asked+', с оценкой '+found,
            {мс:Date.now()-t0, 'образец ответа':sample||'—'});
    return out;
  },
  /* Запись оценки в скрам-задачу. Параметр тоже id, а не taskId.
     entityId обязателен к переносу: без него портал перекладывает задачу в бэклог спринта. */
  async setScrumPoints(taskId, sp){
    let cur=null;
    try{ cur=await this.call('tasks.api.scrum.task.get',{id:Number(taskId)}); }catch(e){}
    const fields={storyPoints:String(sp)};
    const ent=cur&&(cur.entityId||cur.ENTITY_ID);
    if(ent) fields.entityId=Number(ent);
    if(cur&&cur.epicId) fields.epicId=Number(cur.epicId);
    const r=await this.call('tasks.api.scrum.task.update',{id:Number(taskId), fields});
    state.spCache=state.spCache||{};
    state.spCache[String(taskId)]={sp:Number(sp)||0, ts:Date.now()};
    Log.add('sp','Оценка записана в скрам-задачу #'+taskId+': '+sp+' СП',
            {entityId:ent||'—'});
    return r;
  },

  /* --- поля портала: подбираем процент и сторипоинты по заголовкам --- */
  async detectFields(){
    const f=await this.call('tasks.task.getFields');
    const fields=f.fields||f, found={};
    Object.entries(fields).forEach(([name,d])=>{
      if(!/^UF_/.test(name)) return;
      const title=String((d&&d.title)||'').toLowerCase();
      if(!found.pct && /процент|percent|готовн/.test(title)) found.pct=name;
      if(!found.sp && /стори|story|поинт|point|оценк/.test(title)) found.sp=name;
    });
    return found;
  },

  /* --- спринты: имена из скрам-метода, состав — из самих задач по sprintId --- */
  async loadSprints(groupId){
    const gid=Number(groupId);
    const tries=[
      ['tasks.api.scrum.sprint.list',{filter:{groupId:gid}}],
      ['tasks.api.scrum.sprint.list',{filter:{GROUP_ID:gid}}],
      ['tasks.api.scrum.sprint.list',{filter:{groupId:gid},order:{id:'desc'},select:['id','name','status','dateStart','dateEnd','groupId']}],
      ['tasks.api.scrum.sprint.list',{}]
    ];
    let last=null;
    for(const [method,params] of tries){
      try{
        const arr=this.toArray(await this.call(method,params));
        const norm=arr.map(s=>({
          id:String(s.id||s.ID),
          groupId:String(s.groupId||s.GROUP_ID||gid),
          name:s.name||s.NAME||('Спринт #'+(s.id||s.ID)),
          status:String(s.status||s.STATUS||'').toLowerCase(),
          from:this.d(s.dateStart||s.DATE_START), to:this.d(s.dateEnd||s.DATE_END),
          fromRaw:String(s.dateStart||s.DATE_START||''), toRaw:String(s.dateEnd||s.DATE_END||'')
        })).filter(s=>s.id&&s.id!=='undefined'&&String(s.groupId)===String(gid));
        console.log('[спринты]',method,JSON.stringify(params),'→',norm.length);
        if(norm.length) return norm;
      }catch(e){ last=e; console.warn('[спринты]',method,e.message); }
    }
    if(last) throw last;
    return [];
  }
};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two=n=>String(n).padStart(2,'0');
const dtime=ts=>{const d=new Date(ts);return two(d.getDate())+'.'+two(d.getMonth()+1)+'.'+d.getFullYear()+' '+two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());};
const ddate=ts=>{const d=new Date(ts);return two(d.getDate())+'.'+two(d.getMonth()+1)+'.'+d.getFullYear();};
const toCsv=rows=>'\ufeff'+rows.map(r=>r.map(v=>{
  const s=String(v==null?'':v).replace(/"/g,'""');
  return /[";\n]/.test(s)?'"'+s+'"':s;
}).join(';')).join('\r\n');
function download(name, text, mime){
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:(mime||'text/csv')+';charset=utf-8'}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    return true;

/* цвета статусов задаются в настройках и живут в CSS-переменных */
function shade(hex, k){
  const m=/^#?([\da-f]{6})$/i.exec(String(hex||'')); if(!m) return 'var(--line)';
  const n=parseInt(m[1],16), c=[(n>>16)&255,(n>>8)&255,n&255]
    .map(v=>Math.max(0,Math.min(255,Math.round(v*k))));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* =====================  ХОД РАБОТЫ  =====================
   Живая панель в углу и строка состояния: видно, что именно приложение делает
   сейчас и сколько это заняло. Каждый шаг попадает в журнал действий. */
const Progress={
  on:false, t0:0, title:'', items:[], hideT:null, modeWas:'',
  el(){ return document.getElementById('progress'); },
  mode(text){ const m=document.getElementById('mode'); if(m) m.textContent=text; },
  start(title){
    const m=document.getElementById('mode');
    if(!this.on && m) this.modeWas=m.textContent;      // строку состояния вернём как было
    this.on=true; this.t0=Date.now(); this.title=title; this.items=[];
    clearTimeout(this.hideT);
    Log.add('step','▶ '+title);
    this.paint();
    return this.t0;
  },
  step(text, extra){
    const ms=Date.now()-this.t0;
    Log.add('step', text, Object.assign({мс:ms}, extra||{}));
    if(!this.on) return;
    this.items.push({text, ms});
    this.mode(text.length>44?text.slice(0,44)+'…':text);
    this.paint();
  },
  done(text){
    const sec=Math.round((Date.now()-this.t0)/100)/10;
    Log.add('step','■ '+this.title+': '+(text||'готово')+' за '+sec+' с');
    if(!this.on) return;
    this.items.push({text:'Готово: '+(text||''), ms:Date.now()-this.t0, last:true});
    this.paint(sec);
    this.on=false;
    if(this.modeWas) this.mode(this.modeWas);
    clearTimeout(this.hideT);
    this.hideT=setTimeout(()=>{ const e=this.el(); if(e){ e.hidden=true; e.innerHTML=''; } }, 6000);
  },
  fail(msg){
    Log.add('error', this.title+' — сбой: '+msg);
    if(this.on){ this.items.push({text:'Ошибка: '+msg, ms:Date.now()-this.t0, last:true}); this.paint(); }
    this.on=false;
    if(this.modeWas) this.mode(this.modeWas);
    clearTimeout(this.hideT);
    this.hideT=setTimeout(()=>{ const e=this.el(); if(e){ e.hidden=true; e.innerHTML=''; } }, 9000);
  },
  paint(sec){
    const e=this.el(); if(!e) return;
    const last=this.items.slice(-9);
    e.hidden=false;
    e.innerHTML='<h6>'+esc(this.title)+'</h6><ol>'
      + last.map((it,i)=>'<li class="'+(i===last.length-1?'cur':'')+'"><span>'+esc(it.text)
        +'</span><span class="ms">'+it.ms+' мс</span></li>').join('')
      + '</ol>'
      + (sec!=null?'<div class="tot">Всего '+sec+' с</div>':'');
  }
};

const roster=()=>(state.live&&state.users.length?state.users:TEAM);
const person=id=>TEAM.find(t=>t.id===id)||state.users.find(u=>u.id===id)||{name:'Не назначен',role:''};
const GROUPS=[
  {id:'none',     label:'без группировки'},
  {id:'sp',       label:'по сумме сторипоинтов'},
  {id:'sprint',   label:'по спринту'},
  {id:'cat',      label:'по категории проблемы'},
  {id:'who',      label:'по исполнителю текущего этапа'}
];
function groupKey(pr){
  switch(CONFIG.groupBy){
    case 'sp':     { const v=spPlan(pr); return v?String(v):'—'; }
    case 'sprint': return pr.sprintId?String(pr.sprintId):'—';
    case 'cat':    return pr.cat||'—';
    case 'who':    { const cur=currentStage(pr);
                     const a=pr.subs.find(x=>x.stage===cur && x.status!=='done');
                     return a?a.who:'—'; }
    default: return '';
  }
}
function groupTitle(key, list){
  const s=spStats(list), n=list.length;
  const head = CONFIG.groupBy==='sp'     ? (key==='—'?'Без оценки':'Оценка '+key+' СП')
             : CONFIG.groupBy==='sprint' ? (key==='—'?'Бэклог, вне спринта':sprintName(key))
             : CONFIG.groupBy==='cat'    ? catOfCode(key).label
             : CONFIG.groupBy==='who'    ? (key==='—'?'Исполнитель не назначен':person(key).name)
             : '';
  return head+' — заявок '+n+', сторипоинтов '+s.total+' из '+s.plan;
}
function groupProblems(list){
  if(CONFIG.groupBy==='none') return [{key:'', list}];
  const map=new Map();
  list.forEach(pr=>{ const k=groupKey(pr); if(!map.has(k)) map.set(k,[]); map.get(k).push(pr); });
  const groups=[...map.entries()].map(([key,list])=>({key,list}));
  if(CONFIG.groupBy==='sp')
    groups.sort((a,b)=>(Number(b.key)||-1)-(Number(a.key)||-1));           // тяжёлые сверху
  else
    groups.sort((a,b)=>b.list.length-a.list.length);
  return groups;
}
const SORTS=[
  {id:'name',     label:'по наименованию'},
  {id:'sp',       label:'по сумме сторипоинтов'},
  {id:'date',     label:'по дате создания'},
  {id:'activity', label:'по активности'}
];
/* подпись направления зависит от того, что сортируем */
const sortDirLabel=()=>CONFIG.sort==='name' ? (CONFIG.sortDir==='asc'?'А → Я':'Я → А')
  : CONFIG.sort==='sp' ? (CONFIG.sortDir==='desc'?'сначала тяжёлые':'сначала лёгкие')
  : (CONFIG.sortDir==='desc'?'сначала свежие':'сначала давние');
/* Сторипоинты.
   Завершённые задачи считаются целиком, незавершённые — СП × процент завершённости.
   Процент берётся из пользовательского поля; если оно пустое, работает запасное правило. */
const spOf=x=>Number(x.sp||0);
function pctOf(x, pr){
  if(x.pct!=null && x.pct!=='') return Math.max(0, Math.min(100, Number(x.pct)));
  if(CONFIG.pctFallback!=='stages') return 0;
  if(x.status) return x.status==='done'?100:(x.status==='work'?50:0);
  return pr?progress(pr).pct:0;                       // заявка целиком — по закрытым этапам
}
/* Сумма по заявке = оценка самой заявки + сумма оценок подчинённых задач */
function spUnits(pr){
  const units=[];
  if(spOf(pr)>0) units.push({sp:spOf(pr), done:isSolved(pr), pct:pctOf(pr,pr), label:pr.title, own:true});
  pr.subs.filter(x=>spOf(x)>0).forEach(x=>units.push({sp:spOf(x), done:x.status==='done',
    pct:pctOf(x,pr), label:x.title||STAGES[x.stage].name}));
  return units;
}
const spPlan=pr=>spUnits(pr).reduce((a,u)=>a+u.sp,0);
function spStats(list){
  let done=0, open=0, plan=0, counted=0;
  list.forEach(pr=>spUnits(pr).forEach(u=>{
    plan+=u.sp; counted++;
    if(u.done) done+=u.sp; else open+=u.sp*u.pct/100;
  }));
  const r=v=>Math.round(v*10)/10;
  return {done:r(done), open:r(open), total:r(done+open), plan:r(plan), counted};
}
const lastActivity=pr=>Math.max(pr.touchedAt||0, pr.createdAt||0,
  ...pr.subs.map(s=>Math.max(s.touchedAt||0, s.createdAt||0)));
function sortProblems(list){
  const dir=CONFIG.sortDir==='asc'?1:-1;
  return list.slice().sort((a,b)=>{
    if(CONFIG.sort==='name') return a.title.localeCompare(b.title,'ru')*dir;
    if(CONFIG.sort==='sp'){
      const d=(spPlan(a)-spPlan(b))*dir;
      return d||a.title.localeCompare(b.title,'ru');
    }
    const k=CONFIG.sort==='date'?(p=>p.createdAt||0):lastActivity;
    return (k(a)-k(b))*dir;
  });
}
/* сумма сторипоинтов по каждой стадии — выводится в шапку колонки */
function stageSpStats(list){
  const out={};
  STAGES.forEach(s=>{ out[s.id]={plan:0, done:0, open:0, count:0, tasks:0}; });
  (list||[]).forEach(pr=>pr.subs.forEach(x=>{
    const o=out[x.stage]; if(!o) return;
    o.tasks++;
    const sp=spOf(x); if(!sp) return;
    o.plan+=sp; o.count++;
    if(x.status==='done') o.done+=sp; else o.open+=sp*pctOf(x,pr)/100;
  }));
  const r=v=>Math.round(v*10)/10;
  Object.values(out).forEach(o=>{ o.plan=r(o.plan); o.done=r(o.done); o.open=r(o.open); o.total=r(o.done+o.open); });
  return out;
}

const routeOf=pr=>(catOfCode(pr.cat).route||[]);
const hours=h=>h<1?Math.round(h*60)+' мин':(Math.round(h*10)/10)+' ч';

/* закрашиваются ТОЛЬКО завершённые подзадачи */
const stageTasks=(pr,s)=>pr.subs.filter(x=>x.stage===s);
const stageDone=(pr,s)=>{const i=stageTasks(pr,s);return i.length>0 && i.every(x=>x.status==='done');};
const statusRu=x=>x.status==='done'?'завершена':(x.status==='work'?'в работе':'создана');
const candidates=stage=>{
  if(state.live&&state.users.length) return state.users;
  const c=TEAM.filter(t=>t.stages.includes(stage));
  return c.length?c:TEAM;

const missingStages=pr=>routeOf(pr).filter(sid=>!pr.subs.some(x=>x.stage===sid));
const autoMode=pr=>CONFIG.autoCreateRoute && catOfCode(pr.cat).mode!=='manual';
function progress(pr){
  const r=routeOf(pr), done=r.filter(s=>stageDone(pr,s)).length;
  return {done, total:r.length, pct:r.length?Math.round(done/r.length*100):0};
}
function currentStage(pr){
  const r=routeOf(pr);
  const work=pr.subs.find(x=>x.status!=='done' && r.includes(x.stage));
  if(work) return work.stage;
  const next=r.find(s=>!stageDone(pr,s));
  return next===undefined?7:next;
}
const isSolved=pr=>{const p=progress(pr);return p.total>0&&p.done===p.total;};
const spentOf=pr=>pr.subs.reduce((a,s)=>a+(s.spentH||0),0);
function normFor(pr){ return routeOf(pr).reduce((a,s)=>a+STAGES[s].normMax,0); }

/* текущий отбор — один на доску, список и журнал */
function filtered(){
  return state.problems.filter(pr=>{
    const okQ=!state.q||(pr.title+' '+pr.id).toLowerCase().includes(state.q.toLowerCase());
    const okU=!state.user||pr.subs.some(s=>s.who===state.user);
    const okG=!state.group||String(pr.groupId||'')===String(state.group);
    const okS=!state.sprint||inSprint(pr,state.sprint);
    return okQ&&okU&&okG&&okS;
  });
}
/* заявка попадает в спринт и сама, и если в нём стоит любая её подзадача */
function inSprint(pr, sp){
  if(sp==='__backlog') return !pr.sprintId && !pr.subs.some(s=>s.sprintId);
  return String(pr.sprintId||'')===String(sp) || pr.subs.some(s=>String(s.sprintId||'')===String(sp));
}
function filterText(){
  const p=[];
  p.push('проект: '+(state.group?projectName(state.group):'все'));
  p.push('спринт: '+(state.sprint?(state.sprint==='__backlog'?'бэклог':sprintName(state.sprint)):'все'));
  if(state.user) p.push('исполнитель: '+person(state.user).name);
  if(state.q) p.push('поиск: '+state.q);

}

/* строка = заявка пользователя, ячейка = задачи этой стадии */
function lane(pr){

  const cells=STAGES.slice(1,7).map(s=>{
    if(!r.includes(s.id)) return `<div class="cell off"><span>не входит в маршрут</span></div>`;

  return `<div class="lane" data-pr="${pr.id}"><div class="mrow">

/* Состав карточки заявки задаётся на вкладке «Настройки» */
function headCard(pr){
  return '<div class="hcbox">'+headCardBody(pr)+'</div>';
}
function headCardBody(pr){
  if(CONFIG.headMode==='compact')
    return `<h4 data-open="${pr.id}" style="margin:0">${esc(pr.title)}</h4>`;
  const has=f=>CONFIG.headFields.includes(f);
  const r=routeOf(pr), cur=currentStage(pr), pg=progress(pr), out=[];
  if(has('id')) out.push(`<div class="id">${esc(pr.id)}${pr.bxId?' \u00b7 #'+pr.bxId:''}</div>`);
  out.push(`<h4 data-task="${pr.bxId||''}" data-pr="${pr.id}" title="Открыть типовую форму задачи">${esc(pr.title)}</h4>`);
  out.push(`<button class="linkbtn" data-open="${pr.id}">маршрут и подзадачи</button>`);
  if(has('cat')) out.push(`<span class="chip ${catOfCode(pr.cat).cls}">${esc(catOfCode(pr.cat).label)}</span>`);
  if(has('minibar')) out.push(`<div class="minibar">${STAGES.slice(1,7).map(s=>{
    const cls=!r.includes(s.id)?'skip':(stageDone(pr,s.id)?'done':(s.id===cur?'current':''));
    return `<i class="${cls}" title="${esc(s.name)}"></i>`;}).join('')}</div>`);
  const lines=[];
  if(has('progress')) lines.push(`Завершено <b>${pg.done}/${pg.total}</b> этапов \u00b7 <b>${pg.pct}%</b>`);
  if(has('current'))  lines.push(`Сейчас: ${esc(STAGES[cur].name)}`);
  if(has('who')){
    const act=[...new Set(pr.subs.filter(x=>x.stage===cur && x.status!=='done').map(x=>short(person(x.who).name)))];
    lines.push(`Исполнитель: ${act.length?esc(act.join(', ')):'\u2014'}`);
  }
  if(has('effort')) lines.push(`Труд <b class="mono">${hours(spentOf(pr))}</b> из <span class="mono">${hours(normFor(pr))}</span>`);
  if(has('sp')){
    const s=spStats([pr]);
    lines.push(s.counted?`СП <b class="mono">${s.total}</b> из ${s.plan} · завершено ${s.done}`:'СП не проставлены');
  }
  if(has('project')) lines.push(`Проект: ${esc(projectName(pr.groupId))}`);
  if(has('sprint'))  lines.push(`Спринт: ${esc(sprintName(pr.sprintId))}`);
  if(has('count'))  lines.push(`Подзадач <b class="mono">${pr.subs.length}</b>, закрыто ${pr.subs.filter(x=>x.status==='done').length}`);
  if(has('age'))    lines.push(`В работе <b class="mono">${Math.max(1,Math.round((Date.now()-pr.createdAt)/(24*H)))}</b> дн.`);
  if(has('lastmsg') && pr.chat.length){
    const m=pr.chat[pr.chat.length-1];
    lines.push(`<span style="font-style:italic">${esc(m[0])}: ${esc(m[1].length>58?m[1].slice(0,58)+'\u2026':m[1])}</span>`);
  }
  if(CONFIG.cardType==='custom' && (CONFIG.cardFields||[]).length){
    CONFIG.cardFields.forEach(f=>{
      const v=fieldValue(pr,f);
      if(v!=='') lines.push(esc(fieldLabel(f))+': <b>'+esc(v)+'</b>');
    });
  }
  if(lines.length) out.push(`<div class="prog">${lines.join('<br>')}</div>`);
  if(has('ensure') && missingStages(pr).length)
    out.push(`<button class="btn small ghost" style="margin-top:8px" data-ensure="${pr.id}">${autoMode(pr)?'Создать подзадачи':'Создать вручную'}: ${missingStages(pr).length}</button>`);
  return out.join('');
}

function taskCard(pr,x,s){
  const who=person(x.who), cls=x.status;   // new | work | done — цвет задаётся в настройках
  return `<div class="scard ${cls}" draggable="true" data-sid="${x.sid}" data-pr="${pr.id}"
       data-task="${x.bxId||''}" title="Открыть типовую форму задачи">
    <div class="t">${esc(x.title||s.name)}</div>
    <div class="m">
      <select class="who-sel" data-who="${x.sid}" data-pr="${pr.id}" ${x.status==='done'?'disabled':''}>

      </select> · ${statusRu(x)}</div>
    <div class="m">Реакция ${x.reactionMin!=null?x.reactionMin+' мин':'—'} · труд <span class="mono">${hours(x.spentH||0)}</span></div>
    ${spOf(x)?`<div class="m">СП <b class="mono">${spOf(x)}</b>${x.status==='done'?' · зачтено полностью':' · готово '+pctOf(x,pr)+'% → <b class="mono">'+(Math.round(spOf(x)*pctOf(x,pr)/10)/10)+'</b>'}</div>`:''}
    <div class="acts">

      ${x.status!=='done'?`<button class="btn small" data-finish="${x.sid}" data-pr="${pr.id}">Завершил</button>`:''}
    </div>
  </div>`;
}

/* =====================  ДЕЙСТВИЯ  ===================== */
async function addSub(prId, stage, title, quiet){
  const pr=byId(prId); if(!pr) return;
  if(!routeOf(pr).includes(stage)){ toast('Этап вне маршрута категории «'+catOfCode(pr.cat).label+'»'); return; }
  const cat = catOfCode(pr.cat);
  let who = cat.assignees[stage] || (TEAM.find(t=>t.stages.includes(stage))||{id:'galkina'}).id;
  if(state.live && !state.users.some(u=>u.id===who))
    who = (state.me && state.me.id) || (state.users[0]&&state.users[0].id) || who;
  const s=STAGES[stage];
  const x={sid:'s'+(seq++), stage, who, status:'new', reactionMin:null, spentH:0,
           createdAt:Date.now(), title:title||null};
  pr.subs.push(x);
  pr.chat.push(['Система','Создана подзадача «'+(title||'Этап '+s.no+'. '+s.name)+'» на исполнителе '+person(who).name]);
  touch(pr);
  if(state.live && pr.bxId){
    try{
      const r=await BX.addSubtask(pr.bxId, title || `Этап ${s.no}. ${s.name} — ${pr.title}`, state.map[who], s.normMax, stage, pr.cat, pr.groupId||state.group, pr.sprintId);
      x.bxId=r.task.id;
      await BX.setMarker(pr, {stage, cat:pr.cat});
      await BX.comment(pr.bxId, `Создана подзадача «${title || 'Этап '+s.no+'. '+s.name}»`);
    }catch(e){ toast('Битрикс24: '+e.message); }
  }
  Log.add('task','Создана подзадача «'+(title||('Этап '+s.no+'. '+s.name))+'» на исполнителе '+person(who).name,
          {проблема:pr.id, этап:s.no, задача:x.bxId||x.sid});
  if(!quiet){ render(); toast('Подзадача создана: этап '+s.no); }
  return x;
}

/* на каждый этап маршрута — своя подзадача на исполнителе */
async function ensureRoute(prId, quiet){
  const pr=byId(prId); if(!pr) return 0;
  const miss=missingStages(pr);
  for(const sid of miss) await addSub(prId, sid, null, true);
  if(miss.length){
    pr.chat.push(['Система','Маршрут разложен на подзадачи: '+miss.map(s=>'этап '+STAGES[s].no).join(', ')]);
    Log.add('route','Маршрут разложен на подзадачи: '+miss.map(s=>'этап '+STAGES[s].no).join(', '),
            {проблема:pr.id, категория:catOfCode(pr.cat).label, режим:autoMode(pr)?'автоматически':'вручную'});
    render(); if(!quiet) toast('Создано подзадач: '+miss.length);
  }
  return miss.length;
}

async function setWho(prId,sid,who){
  const pr=byId(prId), x=pr&&pr.subs.find(v=>v.sid===sid); if(!x) return;
  x.who=who; x.touchedAt=Date.now(); touch(pr);
  pr.chat.push(['Система','Этап '+STAGES[x.stage].no+' назначен на '+person(who).name]);
  Log.add('task','Смена исполнителя: этап '+STAGES[x.stage].no+' → '+person(who).name, {проблема:pr.id});
  if(state.live && x.bxId){ try{ await BX.setResponsible(x.bxId, state.map[who]); }catch(e){ toast('Битрикс24: '+e.message); } }
  render();
}

async function finishSub(prId,sid){
  const pr=byId(prId), x=pr&&pr.subs.find(v=>v.sid===sid); if(!x) return;
  x.status='done'; x.touchedAt=Date.now(); touch(pr);
  pr.chat.push([person(x.who).name,'Завершил подзадачу «'+(x.title||STAGES[x.stage].name)+'»']);
  Log.add('task','Завершена подзадача «'+(x.title||STAGES[x.stage].name)+'»',
          {проблема:pr.id, этап:STAGES[x.stage].no, исполнитель:person(x.who).name, труд:hours(x.spentH||0)});
  if(state.live && x.bxId){ try{ await BX.complete(x.bxId); }catch(e){ toast('Битрикс24: '+e.message); } }
  render();
  const pg=progress(pr);
  toast(pg.done===pg.total ? pr.id+' — все подзадачи завершены' : 'Полоска закрашена на '+pg.pct+'%');
}
async function startSub(prId,sid){
  const pr=byId(prId), x=pr&&pr.subs.find(v=>v.sid===sid); if(!x) return;
  x.status='work'; x.touchedAt=Date.now(); touch(pr);
  if(x.reactionMin==null) x.reactionMin=Math.round((Date.now()-x.createdAt)/60000);
  Log.add('task','Начата работа: «'+(x.title||STAGES[x.stage].name)+'»',
          {проблема:pr.id, этап:STAGES[x.stage].no, реакция:x.reactionMin+' мин'});
  if(state.live && x.bxId){ try{ await BX.start(x.bxId); }catch(e){ Log.add('error','Не удалось перевести задачу в работу: '+e.message,{задача:x.bxId}); } }
  render();
}
async function moveSub(prId,sid,stage){
  const pr=byId(prId), x=pr&&pr.subs.find(v=>v.sid===sid); if(!x||x.stage===stage) return;
  if(!routeOf(pr).includes(stage)){ toast('Этап вне маршрута категории'); return; }
  const from=x.stage; x.stage=stage; x.touchedAt=Date.now(); touch(pr);
  pr.chat.push(['Система','Подзадача перенесена: '+STAGES[from].name+' → '+STAGES[stage].name]);
  Log.add('task','Подзадача перенесена: '+STAGES[from].name+' → '+STAGES[stage].name, {проблема:pr.id});
  if(state.live && x.bxId){ try{ await BX.setMarker({bxId:x.bxId, xmlId:x.xmlId}, {stage, cat:pr.cat}); }catch(e){ toast('Битрикс24: '+e.message); } }
  render();
}

function wire(){
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openDrawer(b.dataset.open);}));
  document.querySelectorAll('h4[data-task]').forEach(h=>h.addEventListener('click',e=>{
    e.stopPropagation();
    const pr=byId(h.dataset.pr);
    if(h.dataset.task) openTaskForm(h.dataset.task, pr&&pr.title);
    else openDrawer(h.dataset.pr);           // демо-режим: задачи в портале ещё нет
  }));
  document.querySelectorAll('.scard[data-task]').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('button, select, input')) return;
    const pr=byId(c.dataset.pr), x=pr&&pr.subs.find(v=>v.sid===c.dataset.sid);
    if(c.dataset.task) openTaskForm(c.dataset.task, x&&(x.title||STAGES[x.stage].name));
    else toast('Демо-режим: задачи в портале нет');
  }));
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const stage=Number(b.dataset.stage), pr=byId(b.dataset.add);
    const has=pr.subs.some(x=>x.stage===stage);
    const nm=has?prompt('Название дополнительной подзадачи на этапе '+STAGES[stage].no+':',
                        STAGES[stage].name+' — доработка'):null;
    if(has && !nm) return;
    addSub(b.dataset.add, stage, null, nm);
  }));
  document.querySelectorAll('[data-ensure]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); ensureRoute(b.dataset.ensure);
  }));
  document.querySelectorAll('[data-finish]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();finishSub(b.dataset.pr,b.dataset.finish);}));
  document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();startSub(b.dataset.pr,b.dataset.start);}));
  document.querySelectorAll('.who-sel').forEach(sel=>{
    sel.addEventListener('mousedown',e=>e.stopPropagation());
    sel.addEventListener('change',e=>setWho(sel.dataset.pr, sel.dataset.who, e.target.value));
  });

  let drag=null;
  document.querySelectorAll('.scard').forEach(el=>{
    el.addEventListener('dragstart',e=>{drag={pr:el.dataset.pr,sid:el.dataset.sid};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');drag=null;});
  });
  document.querySelectorAll('[data-cell]').forEach(z=>{
    z.addEventListener('dragover',e=>{ if(!drag||drag.pr!==z.dataset.cell) return; e.preventDefault(); z.classList.add('drop-ok'); });
    z.addEventListener('dragleave',()=>z.classList.remove('drop-ok'));
    z.addEventListener('drop',e=>{
      e.preventDefault(); z.classList.remove('drop-ok');
      if(drag && drag.pr===z.dataset.cell) moveSub(drag.pr, drag.sid, Number(z.dataset.stage));
      drag=null;
    });
  });
}

/* =====================  ВЫГРУЗКА СТРУКТУРЫ ПОРТАЛА  =====================
   Собирает то, что реально доступно приложению с его правами: поля задач,
   пользовательские поля, образец задачи, скрам-методы, проекты, спринты. */
async function collectStructure(onStep){
  const raw={}, out=[];
  const line=s=>out.push(s==null?'':String(s));
  const sec=title=>{ line(''); line('='.repeat(78)); line(title); line('='.repeat(78)); };
  const probe=async(method, params)=>{
    if(onStep) onStep(method);
    if(!BX.ready){ raw[method]={__error:'вне портала'}; return {__error:'вне портала'}; }
    try{
      const d=await BX.call(method, params||{});
      raw[method]=d; Log.add('probe','Структура: '+method+' — получено'); return d;
    }catch(e){
      raw[method]={__error:e.message}; Log.add('error','Структура: '+method+' — '+e.message);
      return {__error:e.message};
    }
  };
  const errOf=d=>d&&d.__error?d.__error:null;
  const val=v=>{ const s=typeof v==='object'&&v!==null?JSON.stringify(v):String(v);
                 return s.length>90?s.slice(0,90)+'…':s; };

  let domain=''; try{ domain=BX24.getDomain?BX24.getDomain():''; }catch(e){}

  line('СТРУКТУРА ДАННЫХ БИТРИКС24 — ЗАДАЧИ И СКРАМ');
  line('портал: '+(domain||'—'));
  line('дата: '+dtime(Date.now()));
  line('приложение: Маршрут проблемы (регламент отдела разработки 1С)');
  line('отбор на момент выгрузки: '+filterText());
  line('');
  line('Файл собран запросами к самому порталу, а не по документации:');
  line('здесь то, что доступно приложению с его правами.');

  /* --- поля задачи --- */
  const f=await probe('tasks.task.getFields');
  sec('ПОЛЯ ЗАДАЧИ (tasks.task.getFields)');
  if(errOf(f)) line('недоступно: '+errOf(f));
  else{
    const fields=f.fields||f;
    const names=Object.keys(fields);
    line('всего полей: '+names.length);
    line('');
    line('ПОЛЕ'.padEnd(28)+'ТИП'.padEnd(14)+'ОБЯЗ.'.padEnd(7)+'ТОЛЬКО ЧТ.'.padEnd(12)+'ЗАГОЛОВОК');
    line('-'.repeat(100));
    names.sort().forEach(n=>{
      const d=fields[n]||{};
      line(String(n).padEnd(28)+String(d.type||'—').padEnd(14)
        +(d.required?'да':'—').padEnd(7)+(d.readOnly||d.isReadOnly?'да':'—').padEnd(12)+String(d.title||''));
    });
    const need=['SPRINT_ID','STAGE_ID','XML_ID','PARENT_ID','GROUP_ID','TAGS','TIME_SPENT_IN_LOGS'];
    line('');
    line('нужные приложению: '+need.map(n=>n+(names.includes(n)?' есть':' НЕТ')).join(', '));
  }

  /* --- пользовательские поля --- */
  const uf=await probe('task.item.userfield.getlist');
  sec('ПОЛЬЗОВАТЕЛЬСКИЕ ПОЛЯ ЗАДАЧ (task.item.userfield.getlist)');
  if(errOf(uf)) line('недоступно: '+errOf(uf));
  else{
    const arr=BX.toArray(uf);
    line('полей: '+arr.length);
    arr.forEach(u=>line('  '+(u.FIELD_NAME||u.fieldName||'?')+' — тип '+(u.USER_TYPE_ID||u.userTypeId||'?')
      +', множественное: '+((u.MULTIPLE||u.multiple)==='Y'?'да':'—')+', ID '+(u.ID||u.id||'?')));
    line('');
    line('поле сторипоинтов в настройках: '+(CONFIG.spField||'не задано, используется метка в XML_ID'));
    line('поле процента готовности: '+(CONFIG.pctField||'не задано, используется метка в XML_ID'));
  }

  /* --- образец задачи --- */
  const one=await probe('tasks.task.list',{filter:state.group?{GROUP_ID:Number(state.group)}:{}, select:taskSelect(), start:0});
  sec('ОБРАЗЕЦ ЗАДАЧИ: ЧТО ИМЕННО ПРИСЛАЛ ПОРТАЛ');
  if(errOf(one)) line('недоступно: '+errOf(one));
  else{
    const arr=BX.toArray(one), sample=arr[0];
    line('получено в ответе: '+arr.length+' задач'+(state.group?' (проект '+projectName(state.group)+')':''));
    if(!sample) line('задач нет — показать нечего');
    else{
      line('задача #'+sample.id+', полей в ответе: '+Object.keys(sample).length);
      line('');
      line('ИМЯ В ОТВЕТЕ'.padEnd(30)+'ЗНАЧЕНИЕ');
      line('-'.repeat(100));
      Object.keys(sample).sort().forEach(k=>line(String(k).padEnd(30)+val(sample[k])));
    }
  }

  /* --- скрам --- */
  sec('СКРАМ: КАКИЕ МЕТОДЫ ОТВЕЧАЮТ');
  const gid=state.group?Number(state.group):0;
  const scrum=[
    ['tasks.api.scrum.sprint.list',{filter:{groupId:gid}}],
    ['tasks.api.scrum.backlog.get',{id:gid}],
    ['tasks.api.scrum.item.list',{filter:{entityId:0}}],
    ['tasks.api.scrum.kanban.getFields',{}],
    ['tasks.api.scrum.task.getFields',{}],
    ['tasks.api.scrum.epic.list',{filter:{groupId:gid}}]
  ];
  for(const [m,pms] of scrum){
    const r=await probe(m,pms);
    const e=errOf(r);
    line(m.padEnd(38)+(e?('НЕТ: '+e):('есть, записей: '+BX.toArray(r).length)));
  }
  line('');
  line('проект для проверки: '+(state.group?projectName(state.group)+' (ID '+state.group+')':'не выбран, часть методов вернёт пусто'));
  line('спринты, известные приложению: '+(state.sprints.length
    ? state.sprints.map(s=>s.name+' [ID '+s.id+', проект '+s.groupId+']').join('; ') : 'нет'));
  line('спринты из самих задач (поле sprintId): '
    +[...new Set(state.problems.map(p=>p.sprintId).filter(Boolean))].join(', ')||'—');

  /* --- проекты и пользователь --- */
  const gr=await probe('socialnetwork_api.workgroup.list',{select:['ID','NAME','IS_SCRUM_PROJECT']});
  sec('ПРОЕКТЫ И ГРУППЫ');
  if(errOf(gr)) line('недоступно: '+errOf(gr));
  else BX.toArray(gr).map(g=>g.workgroup||g).slice(0,50)
    .forEach(g=>line('  ID '+(g.id||g.ID)+'  '+(g.name||g.NAME)
      +'  скрам: '+((g.isScrumProject||g.IS_SCRUM_PROJECT)?'да':'—')));

  const me=await probe('user.current');
  sec('ТЕКУЩИЙ ПОЛЬЗОВАТЕЛЬ И ПРАВА');
  if(errOf(me)) line('недоступно: '+errOf(me));
  else line('  '+[me.NAME,me.LAST_NAME].filter(Boolean).join(' ')+' (ID '+me.ID+')'
    +(me.WORK_POSITION?', '+me.WORK_POSITION:''));
  const sc=await probe('scope');
  line('  выданные права (scope): '+(errOf(sc)?errOf(sc):BX.toArray(sc).join(', ')||JSON.stringify(sc)));

  /* --- как это использует приложение --- */
  sec('КАК ЭТИ ПОЛЯ ИСПОЛЬЗУЕТ ПРИЛОЖЕНИЕ');
  line('поля выборки (select): '+taskSelect().join(', '));
  line('этап и категория: '+(CONFIG.storage==='uf'
    ? 'пользовательские поля '+CONFIG.ufStage+' / '+CONFIG.ufCategory
    : 'метка в XML_ID вида bxs:stage=4;bxs:cat=bug'));
  line('сторипоинты и процент: '+((CONFIG.spField||CONFIG.pctField)
    ? (CONFIG.spField||'—')+' / '+(CONFIG.pctField||'—')
    : 'метка в XML_ID вида bxs:sp=8;bxs:pct=60'));
  line('статусы: 5 завершена; 3 и 4 в работе; 2 и 6 ещё не начата');
  line('заявка = задача с parentId 0 (или с родителем вне выборки), подзадача = её дочерняя задача');
  line('спринт задачи берётся из поля sprintId, состав спринта через item.list не запрашивается');
  line('этапы регламента: '+STAGES.slice(1,7).map(s=>s.no+' '+s.name).join('; '));
  line('категории и маршруты: '+Object.entries(CATEGORIES)
    .map(([k,c])=>k+' «'+c.label+'» → '+(c.route.join(',')||'—')+' ['+(c.mode==='manual'?'вручную':'авто')+']').join('; '));

  sec('СЫРЫЕ ОТВЕТЫ ПОРТАЛА (JSON)');
  Object.keys(raw).forEach(m=>{ line(''); line('--- '+m+' ---'); line(JSON.stringify(raw[m],null,1)); });

  return {text:out.join('\r\n'), raw};
}

/* =====================  СПИСОК ЗАДАЧ ПО ОТБОРУ  ===================== */
function taskRows(){
  const rows=[];
  sortProblems(filtered()).forEach((pr,gi)=>{
    const pg=progress(pr);
    const st=spStats([pr]);
    rows.push({_grp:gi, kind:'Заявка', id:pr.bxId||pr.id, parent:'', title:pr.title,
      stage:'', stageName:'маршрут '+pg.done+'/'+pg.total, who:'', status:isSolved(pr)?'решена':'в работе',
      cat:catOfCode(pr.cat).label, project:projectName(pr.groupId), sprint:pr.sprintId?sprintName(pr.sprintId):'бэклог',
      react:'', spent:spentOf(pr), norm:normFor(pr), created:pr.createdAt, active:lastActivity(pr),
      sp:spOf(pr)||st.plan, pct:spOf(pr)?pctOf(pr,pr):'', spDone:st.done, spOpen:st.open, spTotal:st.total});
    routeOf(pr).forEach(sid=>stageTasks(pr,sid).forEach(x=>{
      const sp=spOf(x), pc=sp?pctOf(x,pr):'';
      rows.push({_grp:gi, kind:'Подзадача', id:x.bxId||x.sid, parent:pr.bxId||pr.id, title:x.title||STAGES[sid].name,
        stage:STAGES[sid].no, stageName:STAGES[sid].name, who:person(x.who).name, status:statusRu(x),
        cat:catOfCode(pr.cat).label, project:projectName(pr.groupId), sprint:pr.sprintId?sprintName(pr.sprintId):'бэклог',
        react:x.reactionMin!=null?x.reactionMin:'', spent:x.spentH||0, norm:STAGES[sid].normMax,
        created:x.createdAt, active:x.touchedAt||x.createdAt,
        sp:sp||'', pct:pc, spDone:x.status==='done'?sp:0, spOpen:x.status==='done'?0:Math.round(sp*pc/10)/10,
        spTotal:x.status==='done'?sp:Math.round(sp*pc/10)/10});
    }));
  });
  return rows;
}

/* Колонки списка: подпись, ключ строки и признак числовой сортировки */
const LIST_COLS=[
  {label:'Тип',key:'kind'},{label:'ID',key:'id',num:true},{label:'Родитель',key:'parent',num:true},
  {label:'Название',key:'title'},{label:'Этап',key:'stage'},{label:'Стадия',key:'stageName'},
  {label:'Исполнитель',key:'who'},{label:'Статус',key:'status'},{label:'Категория',key:'cat'},
  {label:'Проект',key:'project'},{label:'Спринт',key:'sprint'},
  {label:'СП',key:'sp',num:true},{label:'% готовности',key:'pct',num:true},
  {label:'СП завершённые',key:'spDone',num:true},{label:'СП незавершённые',key:'spOpen',num:true},
  {label:'СП итого',key:'spTotal',num:true},
  {label:'Реакция, мин',key:'react',num:true},{label:'Труд, ч',key:'spent',num:true},
  {label:'Норматив, ч',key:'norm',num:true},{label:'Создана',key:'created',num:true},
  {label:'Активность',key:'active',num:true}
];
/* Сортировка списка не рвёт иерархию: переставляются заявки целиком, подзадачи едут за своей заявкой */
function sortListRows(rows){
  const s=state.listSort;
  if(!s || !s.key) return rows;
  const col=LIST_COLS.find(c=>c.key===s.key)||{};
  const blocks=new Map();
  rows.forEach(r=>{ if(!blocks.has(r._grp)) blocks.set(r._grp,[]); blocks.get(r._grp).push(r); });
  const arr=[...blocks.values()];
  arr.sort((a,b)=>{
    const va=a[0][s.key], vb=b[0][s.key];
    if(col.num) return ((Number(va)||0)-(Number(vb)||0))*s.dir;
    return String(va==null?'':va).localeCompare(String(vb==null?'':vb),'ru')*s.dir;
  });
  const out=[]; arr.forEach(b=>b.forEach(r=>out.push(r)));
  return out;
}

/* =====================  ДОБОР ЗАДАЧ В СПРИНТ  =====================
   Берём исполнителей текущего спринта, смотрим их задачи, созданные в период
   спринта, и показываем те, которых в спринте нет. Отмеченные — одной кнопкой в спринт. */
function currentSprintObj(){
  if(state.sprint && state.sprint!=='__backlog'){
    const s=state.sprints.find(x=>String(x.id)===String(state.sprint));
    if(s) return s;
  }
  const list=state.sprints.filter(s=>!state.group||String(s.groupId)===String(state.group));
  return list.find(s=>s.status==='active') || (state.group?list[0]:null) || null;
}
/* период спринта: даты портала, иначе — по самым ранним задачам спринта, иначе две недели назад */
function sprintPeriod(sp, tasksInSprint){
  const iso=d=>{ const x=new Date(d); return isNaN(x)?null:x.toISOString().slice(0,10); };
  let from=sp.fromRaw?iso(sp.fromRaw):null, to=sp.toRaw?iso(sp.toRaw):null;
  if(!from && tasksInSprint && tasksInSprint.length){
    const ts=tasksInSprint.map(t=>new Date(t.createdDate||t.CREATED_DATE).getTime()).filter(v=>!isNaN(v));
    if(ts.length) from=iso(Math.min(...ts));
  }
  if(!from) from=iso(Date.now()-14*24*3600*1000);
  if(!to) to=iso(Date.now());
  return {from, to};
}

async function openSprintIntake(){
  const sp=currentSprintObj();
  if(!sp){
    toast('Не выбран спринт: выберите проект и спринт в шапке');
    Log.add('error','Добор в спринт: текущий спринт не определён');
    return;
  }
  Progress.start('Подбор задач для спринта «'+sp.name+'»');
  $('#layer').innerHTML='<div class="scrim"></div><aside class="drawer wide"><header>'
    +'<h2>Подбираю задачи для спринта «'+esc(sp.name)+'»…</h2>'
    +'<div class="routeline">Ход работы виден в панели справа внизу и в журнале действий.</div></header></aside>';
  await new Promise(r=>setTimeout(r,0));

  try{
    let inSprint=[], cand=[];
    if(BX.ready){
      Progress.step('Читаю задачи спринта');
      inSprint=await BX.loadTasks({SPRINT_ID:Number(sp.id)}, 'спринт '+sp.id);
      const users=[...new Set(inSprint.map(t=>t.responsible&&t.responsible.id).filter(Boolean).map(String))];
      Progress.step('Исполнителей в спринте: '+users.length+', задач в спринте: '+inSprint.length);
      if(!users.length) throw new Error('в спринте нет задач с исполнителями — некого отбирать');
      const per=sprintPeriod(sp, inSprint);
      Progress.step('Период спринта: '+per.from+' – '+per.to+', ищу задачи этих исполнителей');
      const f={'>=CREATED_DATE':per.from, '<=CREATED_DATE':per.to+'T23:59:59', RESPONSIBLE_ID:users};
      let raw=[];
      try{ raw=await BX.loadTasks(f, 'исполнители спринта'); }
      catch(e){
        Log.add('probe','Отбор списком исполнителей не принят ('+e.message+') — иду по одному');
        for(const u of users.slice(0,20)){
          try{ raw=raw.concat(await BX.loadTasks({'>=CREATED_DATE':per.from,'<=CREATED_DATE':per.to+'T23:59:59',
                RESPONSIBLE_ID:Number(u)}, 'исполнитель '+u)); }catch(err){}
        }
      }
      const have=new Set(inSprint.map(t=>String(t.id)));
      const seen=new Set();
      cand=raw.filter(t=>{
        const id=String(t.id);
        if(have.has(id) || seen.has(id)) return false;
        if(String(t.sprintId||'')===String(sp.id)) return false;
        seen.add(id); return true;
      });
      state.intake={sprint:sp, period:per, users:users.length, list:cand};
    }else{
      /* демо-режим: те же правила, но по локальным данным */
      const per=sprintPeriod(sp, []);
      cand=state.problems.filter(p=>String(p.sprintId||'')!==String(sp.id))
        .map(p=>({id:p.bxId||p.id, title:p.title, responsible:{id:'', name:person((p.subs[0]||{}).who).name},
                  status:'2', groupId:p.groupId, sprintId:p.sprintId, createdDate:new Date(p.createdAt).toISOString()}));
      state.intake={sprint:sp, period:per, users:0, list:cand, demo:true};
    }
    Progress.step('Кандидатов найдено: '+cand.length);
    renderSprintIntake();
    Progress.done('кандидатов '+cand.length);
    Log.add('report','Подбор задач в спринт «'+sp.name+'»: кандидатов '+cand.length,
            {спринт:sp.id, проект:projectName(sp.groupId)});
  }catch(e){
    Progress.fail(e.message);
    $('#layer').innerHTML='';
    toast('Подбор не удался: '+e.message);
  }
}

async function applySprintIntake(btn){
  const d=state.intake; if(!d) return;
  const ids=[...document.querySelectorAll('[data-pick]')].filter(c=>c.checked).map(c=>c.dataset.pick);
  if(!ids.length){ toast('Не отмечено ни одной задачи'); return; }
  const sp=d.sprint;
  btn.disabled=true; btn.textContent='Включаю…';
  Progress.start('Включение задач в спринт «'+sp.name+'»');
  Progress.step('Отмечено задач: '+ids.length);
  let ok=0, bad=0;
  for(let i=0;i<ids.length;i++){
    const id=ids[i];
    const t=d.list.find(x=>String(x.id)===String(id))||{};
    Progress.step('('+(i+1)+' из '+ids.length+') задача #'+id+' → спринт «'+sp.name+'»');
    if(!BX.ready){                                   // демо: двигаем локально
      const pr=state.problems.find(p=>String(p.bxId||p.id)===String(id));
      if(pr){ pr.sprintId=String(sp.id); ok++; } else bad++;
      continue;
    }
    const fields={SPRINT_ID:Number(sp.id)};
    if(sp.groupId && String(t.groupId||'')!==String(sp.groupId)) fields.GROUP_ID=Number(sp.groupId);
    try{
      await BX.call('tasks.task.update',{taskId:Number(id), fields});
      ok++;
      Log.add('task','Задача #'+id+' включена в спринт «'+sp.name+'»',
              {название:t.title||'', проект:fields.GROUP_ID?projectName(fields.GROUP_ID):'без смены'});
    }catch(e){
      bad++;
      Log.add('error','Задача #'+id+' в спринт не встала: '+e.message, {название:t.title||''});
    }
  }
  Progress.done('включено '+ok+(bad?', не удалось '+bad:''));
  Log.add('report','Добор в спринт «'+sp.name+'» завершён: включено '+ok+', ошибок '+bad);
  toast('В спринт включено: '+ok+(bad?' · ошибок '+bad:''));
  $('#layer').innerHTML='';
  if(BX.ready) refresh(); else { fillSprints(); render(); }
}
