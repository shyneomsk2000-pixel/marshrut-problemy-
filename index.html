        <button class="btn ghost" data-test="fail">Тест не пройден → выработка решения</button>
      </div>
      <div class="note">Отрицательный результат возобновляет задачу на выработку решения, положительный создаёт подзадачу внедрения в рабочую базу.</div>
    </div>`:'';

  $('#layer').innerHTML=`<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-label="Заявка пользователя">
      <header>
        <div class="mono" style="font-size:10.5px;color:var(--ink-2)">${esc(pr.id)} · завершено ${pg.done}/${pg.total} · ${pg.pct}%</div>
        <h2>${esc(pr.title)}</h2>
        <div class="rowbtns" style="margin-top:0 0 8px">
          <button class="btn small ghost" data-bx="${pr.bxId||''}">Открыть задачу в Битрикс24</button>
        </div>
        <label style="font-size:12px;color:var(--ink-2)">Категория проблемы задаёт маршрут
          <select class="f-input" id="catSel" style="display:block;margin-top:6px;width:100%">
            ${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${k===pr.cat?'selected':''}>${v.label} — этапы ${v.route.join(', ')}</option>`).join('')}
          </select></label>
      </header>
      <div class="body">
        <div class="sec"><h5>Сторипоинты заявки</h5>
          <div class="trow">
            <span class="n">СП</span>
            <div><b>Оценка всей заявки</b><div style="font-size:11px;color:var(--ink-2)">
              Заполните, если оценка ставится на заявку целиком. Пусто — сумма считается по подзадачам.</div></div>
            <div style="display:flex;gap:5px;align-items:center">
              <input class="spin" type="number" min="0" step="1" placeholder="СП" value="${spOf(pr)||''}" data-sp="__pr">
              <input class="spin" type="number" min="0" max="100" step="5" placeholder="%" value="${pr.pct!=null&&pr.pct!==''?pr.pct:''}" data-pct="__pr">
            </div>
          </div>
          ${(()=>{const s=spStats([pr]), own=spOf(pr), kids=pr.subs.reduce((a,x)=>a+spOf(x),0);
            return s.counted?`<div class="note">План <b class="mono">${s.plan}</b> = заявка <b class="mono">${own}</b> + подчинённые <b class="mono">${kids}</b>.<br>
              Зачтено <b class="mono">${s.total}</b> = завершённые <b class="mono">${s.done}</b> + незавершённые <b class="mono">${s.open}</b>.</div>`
              :'<div class="note">Оценка ещё не проставлена.</div>';})()}
        </div>

        <div class="sec"><h5>Задачи по стадиям</h5>${tree}
          ${missingStages(pr).length?`<div class="rowbtns"><button class="btn" data-ensure-all>Создать подзадачи на все этапы маршрута (${missingStages(pr).length})</button></div>`:''}
          <label class="check" style="border:0"><input type="checkbox" id="mergeChk" ${merged?'checked':''}>
            <span>Объединить этапы 1–3 в одну подзадачу с чек-листом</span></label>
        </div>
        ${checklist}${test}
        <div class="sec"><h5>Переписка — только в заявке пользователя</h5>
          <div class="chat">${pr.chat.map(m=>`<div class="msg"><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('')||'<div class="msg">Сообщений пока нет.</div>'}</div>
          <div class="rowbtns"><input class="f-input" id="msg" placeholder="Написать в заявку" style="flex:1">
            <button class="btn small" data-send>Отправить</button></div>
        </div>
      </div>
    </aside>`;

  const close=()=>{$('#layer').innerHTML='';};
  $('#layer').querySelector('[data-close]').addEventListener('click',close);
  const bxBtn=$('#layer').querySelector('[data-bx]');
  if(bxBtn) bxBtn.addEventListener('click',()=>openTaskForm(bxBtn.dataset.bx, pr.title));
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k);}});
  $('#catSel').addEventListener('change',async e=>{
    pr.cat=e.target.value;
    Log.add('route','Категория изменена на «'+catOfCode(pr.cat).label+'»',
            {проблема:pr.id, маршрут:routeOf(pr).join(', ')});
    if(state.live && pr.bxId){ try{ await BX.setMarker(pr, {stage:currentStage(pr), cat:pr.cat}); }
      catch(err){ Log.add('error','Не удалось записать метку этапа: '+err.message,{задача:pr.bxId}); toast('Битрикс24: '+err.message); } }
    if(autoMode(pr)) await ensureRoute(pr.id,true);
    render(); openDrawer(pr.id);
    toast(autoMode(pr)?'Маршрут пересобран, подзадачи созданы на каждый этап':'Маршрут пересобран, подзадачи создаются вручную');
  });
  $('#mergeChk').addEventListener('change',e=>{pr.merged=e.target.checked;openDrawer(pr.id);});
  $('#layer').querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',e=>{pr.checks[e.target.dataset.check]=e.target.checked;}));
  $('#layer').querySelectorAll('[data-mkadd]').forEach(el=>el.addEventListener('click',async()=>{
    const sid=Number(el.dataset.mkadd), has=stageTasks(pr,sid).length;
    const nm=has?prompt('Название дополнительной подзадачи:',STAGES[sid].name+' — доработка'):null;
    if(has&&!nm) return;
    await addSub(pr.id,sid,nm); openDrawer(pr.id);
  }));
  const ea=$('#layer').querySelector('[data-ensure-all]');
  if(ea) ea.addEventListener('click',async()=>{await ensureRoute(pr.id);openDrawer(pr.id);});
  const saveSp=async(target, field, raw)=>{
    const val = raw===''?null:Math.max(0, Number(raw)||0);
    const patch = field==='sp'?{sp:val==null?'':val}:{pct:val==null?'':val};
    target[field]= val==null?(field==='sp'?0:null):val;
    Log.add('sp', (field==='sp'?'Сторипоинты':'Процент завершённости')+': '
      +(target===pr?'заявка':(target.title||STAGES[target.stage].name))+' → '+(val==null?'очищено':val),
      {заявка:pr.id});
    const bxId = target===pr?pr.bxId:target.bxId;
    if(state.live && bxId){
      try{
        if(field==='sp' && CONFIG.spSource==='scrum'){ await BX.setScrumPoints(bxId, val||0); }
        else await BX.setMarker({bxId, xmlId:target.xmlId||''}, patch);
      }catch(e){ Log.add('error','Не удалось записать оценку: '+e.message,{задача:bxId}); toast('Битрикс24: '+e.message); }
    }
    render(); openDrawer(pr.id);
  };
  $('#layer').querySelectorAll('[data-sp]').forEach(el=>el.addEventListener('change',e=>{
    const id=el.dataset.sp;
    saveSp(id==='__pr'?pr:pr.subs.find(v=>v.sid===id), 'sp', e.target.value);
  }));
  $('#layer').querySelectorAll('[data-pct]').forEach(el=>el.addEventListener('change',e=>{
    const id=el.dataset.pct;
    saveSp(id==='__pr'?pr:pr.subs.find(v=>v.sid===id), 'pct', e.target.value);
  }));
  $('#layer').querySelectorAll('[data-mkfin]').forEach(el=>el.addEventListener('click',async()=>{await finishSub(pr.id,el.dataset.mkfin);openDrawer(pr.id);}));
  $('#layer').querySelectorAll('[data-test]').forEach(b=>b.addEventListener('click',async()=>{
    const t=pr.subs.find(x=>x.stage===5&&x.status!=='done');
    if(b.dataset.test==='ok'){ pr.chat.push(['Постановщик','Тест положительный, замечаний нет']); await finishSub(pr.id,t.sid); await addSub(pr.id,6,null,true); render(); }
    else { pr.chat.push(['Постановщик','Тест отрицательный, решение возвращается на доработку']);
           await addSub(pr.id,4,'Исправление по итогам теста',true); render(); }
    openDrawer(pr.id);
  }));
  $('#layer').querySelector('[data-send]').addEventListener('click',async()=>{
    const v=$('#msg').value.trim(); if(!v) return;
    pr.chat.push(['Вы',v]); touch(pr);
    if(state.live&&pr.bxId){ try{ await BX.comment(pr.bxId,v);}catch(e){toast('Битрикс24: '+e.message);} }
    openDrawer(pr.id);
  });
}

/* =====================  СПРАВОЧНИК КАТЕГОРИЙ И МАРШРУТОВ  ===================== */
function usedBy(code){ return state.problems.filter(p=>p.cat===code).length; }
/* живой предпросмотр: карточка заявки и карточка подзадачи текущими настройками */
function cardPreviewHtml(){
  const pr=state.problems[0];
  if(!pr) return '<span class="routeline">Нет задач для предпросмотра</span>';
  const sub=pr.subs[0];
  return `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
    <div class="lane-head" style="max-width:300px;padding:0">${headCard(pr)}</div>
    ${sub?`<div style="width:230px">${taskCard(pr,sub,STAGES[sub.stage]||STAGES[1])}</div>`:''}
  </div>`;
}

        ${['new','work','done'].map(k=>`<div class="scard ${k}" style="cursor:default;max-width:190px;margin:0">
          <div class="t">Пример: ${k==='new'?'создана':(k==='work'?'выполняется':'завершена')}</div>
          <div class="m">Исполнитель · этап 4</div></div>`).join('')}
      </div>
      <div class="rowbtns"><button class="btn small ghost" id="colReset">Вернуть цвета по умолчанию</button></div>
      <div class="routeline">Цвет красит карточку в ячейке и строку в панели заявки. Рамка подбирается автоматически, темнее заливки.</div>
    </div>

    <div class="settings">
      <h5 style="margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)">Сторипоинты</h5>
      <label>Откуда берутся сторипоинты
        <select class="f-input" id="setSpSrc" style="min-width:300px">
          <option value="marker" ${CONFIG.spSource==='marker'?'selected':''}>метка в XML_ID задачи (без настройки портала)</option>
          <option value="field" ${CONFIG.spSource==='field'?'selected':''}>пользовательское поле задачи</option>
          <option value="scrum" ${CONFIG.spSource==='scrum'?'selected':''}>storyPoints скрам-задачи (tasks.api.scrum.task)</option>
        </select>
      </label>
      <label><input type="checkbox" id="setSpAuto" ${CONFIG.spSourceAuto?'checked':''}>
        Подбирать источник сам: если оценок в метке нет, брать storyPoints из скрам-задач</label>
      <label>Поле со сторипоинтами
        <input class="f-input" id="setSp" value="${esc(CONFIG.spField)}" placeholder="например UF_STORY_POINTS">
      </label>
      <label>Поле с процентом завершённости
        <input class="f-input" id="setPct" value="${esc(CONFIG.pctField)}" placeholder="например UF_PERCENT_DONE">
      </label>
      <label>Если процент не заполнен
        <select class="f-input" id="setPctFb" style="min-width:260px">
          <option value="stages" ${CONFIG.pctFallback==='stages'?'selected':''}>считать по статусу и закрытым этапам</option>
          <option value="zero" ${CONFIG.pctFallback==='zero'?'selected':''}>считать нулём</option>
        </select>
      </label>
      <div class="rowbtns">
        <button class="btn small ghost" id="fieldsAuto">Подобрать поля автоматически</button>
        <button class="btn small ghost" id="spProbe">Проверить, где лежат оценки</button>
      </div>
      <div class="routeline" id="spProbeOut">Текущий источник: <b>${CONFIG.spSource==='scrum'?'storyPoints скрам-задачи'
        :(CONFIG.spSource==='field'?('поле '+(CONFIG.spField||'не задано')):'метка в XML_ID')}</b>.
        Проверка опрашивает первые задачи текущего отбора и показывает, что реально отдаёт портал.</div>
      <div class="routeline">Оставьте поля пустыми — оценка будет храниться в метке задачи вместе с этапом,
        настраивать на портале ничего не нужно. Формула: <span class="mono">итого = СП завершённых задач
        + Σ(СП × процент готовности) по незавершённым</span>.</div>
      ${(()=>{const s=spStats(state.problems);return `<div class="preview">Сейчас по всем заявкам:
        итого <b class="mono">${s.total}</b> = завершённые <b class="mono">${s.done}</b>
        + незавершённые <b class="mono">${s.open}</b>, план ${s.plan}, задач с оценкой ${s.counted}</div>`;})()}
    </div>

    <div class="settings">
      <h5 style="margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)">Журнал действий</h5>
      <label><input type="checkbox" id="setLog" ${CONFIG.logSave?'checked':''}>
        Сохранять журнал между сеансами</label>
      <label><input type="checkbox" id="setLogV" ${CONFIG.logVerbose?'checked':''}>
        Полное логирование: каждый запрос к порталу с параметрами, числом записей и временем ответа</label>
      <label>Хранить записей
        <select class="f-input" id="setLogLimit" style="min-width:140px">
          ${[100,300,1000,3000].map(n=>`<option value="${n}" ${Number(CONFIG.logLimit)===n?'selected':''}>${n}</option>`).join('')}
        </select>
        <span class="routeline" style="margin:0">сейчас записей: <b class="mono">${Log.items.length}</b></span>
      </label>
      <div class="rowbtns">
        <button class="btn small" id="logCsv">Скачать журнал CSV</button>
        <button class="btn small ghost" id="logClear">Очистить журнал</button>
      </div>
      ${Log.items.length?`<div class="preview" style="max-height:220px;overflow:auto">
        <table class="listtab"><tbody>${Log.items.slice(-12).reverse().map(r=>`<tr>
          <td class="mono" style="white-space:nowrap">${esc(dtime(r.ts))}</td>
          <td>${esc(r.kind)}</td><td>${esc(r.text)}</td>
          <td class="mono" style="font-size:10.5px;color:var(--ink-2)">${esc(r.extra?Object.entries(r.extra).map(([k,v])=>k+': '+v).join(', '):'')}</td>
        </tr>`).join('')}</tbody></table></div>
        <div class="routeline">Показаны последние 12 записей, в файл выгружаются все.</div>`
        :'<div class="routeline">Журнал пока пуст.</div>'}
    </div>

    ${cards}
    <div class="rowbtns">
      <button class="btn" id="catAdd">Добавить категорию</button>
      <button class="btn ghost" id="catReset">Вернуть категории из регламента</button>
    </div>
  </div>`;

  const save=(rerender)=>{ Store.write(); if(rerender!==false) renderRoutes(); };

  $('#setAuto').addEventListener('change',e=>{ CONFIG.autoCreateRoute=e.target.checked; save(); toast(e.target.checked?'Подзадачи создаются по маршруту':'Подзадачи создаются вручную'); });
  $('#setIntake').addEventListener('change',e=>{ CONFIG.createOnIntake=e.target.value; save(false); });
  const runStruct=async(kind)=>{
    const st=$('#structState'), b1=$('#structTxt'), b2=$('#structJson');
    b1.disabled=b2.disabled=true;
    const t0=Date.now();
    Log.add('probe','Запущена выгрузка структуры портала');
    try{
      const res=await collectStructure(m=>{ st.textContent='опрашиваю: '+m+'…'; });
      const stamp=ddate(Date.now()).replace(/\./g,'-');
      if(kind==='json') download('структура-json-'+stamp+'.json', JSON.stringify(res.raw,null,1),'application/json');
      else download('структура-задач-'+stamp+'.txt', res.text, 'text/plain');
      st.textContent='готово за '+Math.round((Date.now()-t0)/100)/10+' с · методов опрошено: '+Object.keys(res.raw).length;
      Log.add('probe','Структура выгружена', {методов:Object.keys(res.raw).length, формат:kind==='json'?'JSON':'TXT'});
    }catch(e){
      st.textContent='ошибка: '+e.message;
      Log.add('error','Выгрузка структуры не удалась: '+e.message);
    }finally{ b1.disabled=b2.disabled=false; }
  };
  $('#structTxt').addEventListener('click',()=>runStruct('txt'));
  $('#structJson').addEventListener('click',()=>runStruct('json'));

  document.querySelectorAll('[data-color]').forEach(el=>el.addEventListener('change',e=>{
    CONFIG.colors[el.dataset.color]=e.target.value;
    applyColors(); Log.add('view','Цвет статуса «'+el.dataset.color+'» изменён на '+e.target.value);
    save();
  }));
  $('#colReset').addEventListener('click',()=>{
    CONFIG.colors={new:'#FFFDF7', work:'#FCF1BE', done:'#E2F0DD'};
    applyColors(); save(); toast('Цвета сброшены');
  });
  $('#setSpAuto').addEventListener('change',e=>{ CONFIG.spSourceAuto=e.target.checked; save(false); });
  $('#setSpSrc').addEventListener('change',e=>{ CONFIG.spSource=e.target.value;
    Log.add('view','Источник сторипоинтов: '+CONFIG.spSource); save(); });
  $('#spProbe').addEventListener('click',async()=>{
    const out=$('#spProbeOut'), btn=$('#spProbe');
    btn.disabled=true; out.textContent='опрашиваю портал…';
    const list=filtered().length?filtered():state.problems;
    const ids=[], push=v=>{ if(v && ids.indexOf(String(v))<0) ids.push(String(v)); };
    list.forEach(p=>{ if(p.sprintId){ push(p.bxId); p.subs.forEach(x=>push(x.bxId)); } });
    list.forEach(p=>{ push(p.bxId); p.subs.forEach(x=>push(x.bxId)); });
    const sample=ids.slice(0,50);
    const marker=list.reduce((a,p)=>a+(p.sp?1:0)+p.subs.filter(x=>x.sp).length,0);
    const uf=CONFIG.spField
      ? list.reduce((a,p)=>a+(fieldValue(p,CONFIG.spField)!==''?1:0),0) : null;
    let scrum=null, err='', raw='';
    if(BX.ready && sample.length){
      try{
        const one=await BX.call('tasks.api.scrum.task.get',{id:Number(sample[0])});
        raw=JSON.stringify(one).slice(0,220);
      }catch(e){ err=e.message; }
      try{
        state.spCache={};                       // проверяем портал, а не кэш
        const pts=await BX.loadScrumPoints(sample);
        scrum=Object.keys(pts).length;
      }catch(e){ err=err||e.message; }
    }
    const lines=[
      'Проверено задач: <b>'+sample.length+'</b>'+(BX.ready?'':' (вне портала проверка неполная)'),
      'Метка в XML_ID: задач с оценкой <b>'+marker+'</b>',
      CONFIG.spField?('Поле '+esc(CONFIG.spField)+': задач со значением <b>'+uf+'</b>'):'Поле со сторипоинтами не задано',
      'Скрам-задача (tasks.api.scrum.task.get, параметр id): '
        +(scrum===null?'не проверялось':('задач с оценкой <b>'+scrum+'</b>')),
      raw?('Ответ портала по задаче #'+esc(sample[0])+': <span class="mono">'+esc(raw)+'</span>'):'',
      err?('Ошибка: <b>'+esc(err)+'</b>'):''
    ].filter(Boolean);
    out.innerHTML=lines.join('<br>');
    Log.add('probe','Проверка источника сторипоинтов: метка '+marker+', скрам '+(scrum===null?'—':scrum)
      +', задач '+sample.length, {ошибка:err||'—'});
    if(scrum && !marker && CONFIG.spSource!=='scrum'){
      CONFIG.spSource='scrum'; Store.write();
      out.innerHTML+='<br><b>Источник переключён на скрам-задачи.</b> Нажмите «Обновить» в шапке.';
    }
    btn.disabled=false;
  });
  $('#fieldsAuto').addEventListener('click',async()=>{
    if(!BX.ready){ toast('Нужен портал'); return; }
    try{
      const f=await BX.detectFields();
      if(f.pct) CONFIG.pctField=f.pct;
      if(f.sp){ CONFIG.spField=f.sp; CONFIG.spSource='field'; }
      Log.add('view','Автоподбор полей: процент — '+(f.pct||'не найдено')+', сторипоинты — '+(f.sp||'не найдено'));
      save();
      toast('Процент: '+(f.pct||'не найдено')+' · СП: '+(f.sp||'не найдено'));
    }catch(e){ toast('Битрикс24: '+e.message); }
  });
  $('#setSp').addEventListener('change',e=>{ CONFIG.spField=e.target.value.trim(); save(); toast('Поле сторипоинтов: '+(CONFIG.spField||'метка задачи')); });
  $('#setPct').addEventListener('change',e=>{ CONFIG.pctField=e.target.value.trim(); save(); });
  $('#setPctFb').addEventListener('change',e=>{ CONFIG.pctFallback=e.target.value; save(); });
  $('#setLog').addEventListener('change',e=>{
    CONFIG.logSave=e.target.checked;
    if(CONFIG.logSave){ Log.save(); toast('Журнал сохраняется'); }
    else { try{ localStorage.removeItem(Log.key); }catch(err){} toast('Журнал только на время сеанса'); }
    save(false);
  });
  $('#setLogV').addEventListener('change',e=>{
    CONFIG.logVerbose=e.target.checked;
    Log.add('view','Полное логирование '+(CONFIG.logVerbose?'включено':'выключено'));
    save(false);
  });
  $('#setLogLimit').addEventListener('change',e=>{
    CONFIG.logLimit=Number(e.target.value);
    if(Log.items.length>CONFIG.logLimit) Log.items=Log.items.slice(-CONFIG.logLimit);
    Log.save(); save();
  });
  $('#logCsv').addEventListener('click',()=>{
    if(!Log.items.length){ toast('Журнал пуст'); return; }
    download('журнал-'+ddate(Date.now()).replace(/\./g,'-')+'.csv', Log.csv());
  });
  $('#logClear').addEventListener('click',()=>{
    if(!confirm('Очистить журнал действий?')) return;
    Log.clear(); renderRoutes(); toast('Журнал очищен');
  });
  $('#setGroup').addEventListener('change',e=>{ CONFIG.groupBy=e.target.value;
    Log.add('view','Группировка: '+e.target.value); save(false); });
  $('#setSort').addEventListener('change',e=>{
    CONFIG.sort=e.target.value;
    CONFIG.sortDir = CONFIG.sort==='name'?'asc':'desc';
    save();
  });
  $('#setDir').addEventListener('click',()=>{ CONFIG.sortDir=CONFIG.sortDir==='asc'?'desc':'asc'; save(); });

  /* --- тип карточки: типовая или пользовательская --- */
  document.querySelectorAll('[data-ctype]').forEach(b=>b.addEventListener('click',()=>{
    CONFIG.cardType=b.dataset.ctype;
    Log.add('view','Тип карточки: '+(CONFIG.cardType==='custom'?'пользовательская':'типовая'));
    save();
    if(CONFIG.cardType==='custom' && BX.ready && !state.taskFields)
      BX.call('tasks.task.getFields',{}).then(f=>{ state.taskFields=(f&&(f.fields||f))||null;
        Log.add('load','Поля задач получены для конструктора карточки: '
          +Object.keys(state.taskFields||{}).length); renderRoutes(); }).catch(e=>{});
  }));
  const filterFields=q=>{
    q=String(q||'').trim().toLowerCase();
    document.querySelectorAll('[data-fname]').forEach(el=>{
      el.style.display = !q || el.dataset.fname.toLowerCase().includes(q)
        || el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
  const cfq=$('#cardFieldQ');
  if(cfq){
    filterFields(state.cardFieldQ);                       // поиск переживает перерисовку настроек
    cfq.addEventListener('input',e=>{ state.cardFieldQ=e.target.value; filterFields(e.target.value); });
  }
  const cfc=$('#cardFieldsClear');
  if(cfc) cfc.addEventListener('click',()=>{ CONFIG.cardFields=[]; save(); toast('Поля карточки очищены'); });
  document.querySelectorAll('[data-cfield]').forEach(el=>el.addEventListener('change',e=>{
    const name=el.dataset.cfield;
    CONFIG.cardFields = e.target.checked
      ? (CONFIG.cardFields||[]).concat(name).filter((v,i,a)=>a.indexOf(v)===i)
      : (CONFIG.cardFields||[]).filter(v=>v!==name);
    Store.write();
    Log.add('view','Поле карточки '+(e.target.checked?'добавлено':'убрано')+': '+name);
    const need = e.target.checked && TASK_SELECT_BASE.indexOf(name)<0;
    renderRoutes();
    if(need && BX.ready){ toast('Поле добавлено в запрос — перечитываю задачи'); refresh(); }
  }));

  /* --- высота карточки и шрифт --- */
  const paintPreview=()=>{ ['#cardPreview','#cardPreview2'].forEach(sel=>{
    const el=$(sel); if(el) el.innerHTML=cardPreviewHtml(); }); };
  document.querySelectorAll('[data-hh]').forEach(b=>b.addEventListener('click',()=>{
    CONFIG.headH = b.dataset.hh==='fix' ? (Number($('#setHeadH').value)||140) : 0;
    applyView(); save();
  }));
  const hh=$('#setHeadH');
  if(hh) hh.addEventListener('input',e=>{
    CONFIG.headH=Number(e.target.value)||0;
    $('#setHeadHV').textContent=CONFIG.headH+' px';
    applyView(); paintPreview(); Store.write();
  });
  const cfs=$('#setCardFs');
  if(cfs) cfs.addEventListener('input',e=>{
    CONFIG.cardFs=Number(e.target.value)||12;
    $('#setCardFsV').textContent=CONFIG.cardFs+' px';
    applyView(); paintPreview(); Store.write();
  });
  const cff=$('#setCardFf');
  if(cff) cff.addEventListener('change',e=>{ CONFIG.cardFf=e.target.value; applyView(); paintPreview(); Store.write();
    Log.add('view','Шрифт карточек: '+(CARD_FONTS.find(f=>f.id===e.target.value)||{label:'по умолчанию'}).label); });
  const cr=$('#cardReset');
  if(cr) cr.addEventListener('click',()=>{ CONFIG.headH=0; CONFIG.cardFs=12; CONFIG.cardFf='';
    applyView(); save(); toast('Вид карточек возвращён к исходному'); });
  document.querySelectorAll('[data-headermode]').forEach(b=>b.addEventListener('click',()=>{
    CONFIG.headerMode=b.dataset.headermode; save();
  }));
  document.querySelectorAll('[data-hmode]').forEach(b=>b.addEventListener('click',()=>{
    CONFIG.headMode=b.dataset.hmode; syncViewToggle(); save();
  }));
  document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',e=>{
    const id=el.dataset.field;
    CONFIG.headFields = e.target.checked
      ? CONFIG.headFields.concat(id).filter((v,i,a)=>a.indexOf(v)===i)
      : CONFIG.headFields.filter(v=>v!==id);
    save();
  }));

  document.querySelectorAll('[data-name]').forEach(el=>el.addEventListener('change',e=>{
    const c=CATEGORIES[el.dataset.name]; if(!e.target.value.trim()) { e.target.value=c.label; return; }
    c.label=e.target.value.trim(); save(false);
  }));
  document.querySelectorAll('[data-tog]').forEach(b=>b.addEventListener('click',()=>{
    const c=CATEGORIES[b.dataset.tog], s=Number(b.dataset.stage);
    if(c.route.includes(s)){ c.route=c.route.filter(v=>v!==s); delete c.assignees[s]; }
    else c.route=c.route.concat(s).sort((a,b2)=>a-b2);
    save();
  }));
  document.querySelectorAll('[data-asg]').forEach(sel=>sel.addEventListener('change',e=>{
    const c=CATEGORIES[sel.dataset.asg], s=sel.dataset.stage;
    if(e.target.value) c.assignees[s]=e.target.value; else delete c.assignees[s];
    save(false);
  }));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    CATEGORIES[b.dataset.mode].mode=b.dataset.val; save();
  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    if(usedBy(b.dataset.del)) return;
    if(Object.keys(CATEGORIES).length<2){ toast('Нужна хотя бы одна категория'); return; }
    delete CATEGORIES[b.dataset.del]; save();
  }));
  $('#catAdd').addEventListener('click',()=>{
    const name=prompt('Название категории проблем:'); if(!name) return;
    let code='cat'+(Object.keys(CATEGORIES).length+1);
    while(CATEGORIES[code]) code+='x';
    CATEGORIES[code]={label:name.trim(), route:[1], cls:CAT_CLASSES[Object.keys(CATEGORIES).length%CAT_CLASSES.length],
                      mode:'manual', assignees:{}};
    save(); toast('Категория добавлена, отметьте её этапы');
  });
  $('#catReset').addEventListener('click',()=>{
    if(!confirm('Вернуть четыре категории из регламента? Свои категории будут удалены.')) return;
    CATEGORIES=JSON.parse(JSON.stringify(DEFAULT_CATS)); save(); toast('Справочник восстановлен');
  });
}

function renderReglament(){
  $('#app').innerHTML=`<div class="page">
    <h1>Регламент выполнения заявки пользователей</h1>
    <p class="lead">Заказчик приходит с проблемой, а не с задачей. Проблему нарезаем на этапы, этапы — на исполнителей. На выходе получаем конкретную задачу на конкретном исполнителе, а подзадачи двигают проблему к решению.</p>

    <table><thead><tr><th>№</th><th>Этап</th><th>Результат процесса</th><th>Норматив</th><th>Кто ведёт</th></tr></thead><tbody>
    ${STAGES.slice(1,7).map(s=>`<tr><td class="num">${s.no}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.result)}</td>
      <td class="mono">${hours(s.normMin)} – ${hours(s.normMax)}</td><td>${esc(s.role)}</td></tr>`).join('')}
    </tbody></table>
    <p class="lead" style="margin-top:10px">Норматив написания кода вчетверо больше норматива на ТЗ: чем лучше написано ТЗ, тем меньше времени уходит на кодирование. Время тестирования коррелирует со сложностью задачи.</p></div>

    <div class="sec"><h5>Категория определяет маршрут</h5>
    <table><thead><tr><th>Категория</th><th>Маршрут</th><th>Подзадачи</th></tr></thead><tbody>
    ${Object.values(CATEGORIES).map(c=>`<tr><td><span class="chip ${c.cls}">${esc(c.label)}</span></td>
      <td class="mono">${c.route.length?c.route.map(i=>i+' '+STAGES[i].name).join('  →  '):'—'}</td>
      <td>${c.mode==='manual'?'вручную':'по маршруту'}</td></tr>`).join('')}
    </tbody></table>
    <p class="lead" style="margin-top:10px">Справочник категорий и маршруты редактируются на вкладке «Маршруты».</p></div>

    <div class="sec"><h5>Что видно по каждой подзадаче</h5>
    <table><tbody>
      <tr><td class="num">1</td><td>Кто делал</td></tr><tr><td class="num">2</td><td>В какие сроки сделано</td></tr>
      <tr><td class="num">3</td><td>Когда приступил — время реакции</td></tr><tr><td class="num">4</td><td>Сколько времени делал — трудозатраты</td></tr>

/* сборка заявок и подзадач из плоского ответа портала */
function buildProblems(raw){
  const users={};
  raw.forEach(t=>{
    const r=t.responsible;
    if(r&&r.id) users['u'+r.id]={id:'u'+r.id, bxId:String(r.id), name:r.name||('Сотрудник #'+r.id),
                                 role:r.workPosition||'', stages:[], duties:[]};
  });
  state.users=Object.values(users).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  state.users.forEach(u=>{ state.map[u.id]=u.bxId; });

  const ts=v=>{ const d=new Date(v); return isNaN(d)?Date.now():d.getTime(); };
  const ids=new Set(raw.map(t=>String(t.id)));
  /* задача-сирота: её родитель не попал в выборку — показываем её как самостоятельную заявку */
  const parents=raw.filter(t=>BX.num(t.parentId)===0 || !ids.has(String(t.parentId)));
  const kids=raw.filter(t=>BX.num(t.parentId)>0 && ids.has(String(t.parentId)));

  state.problems=parents.map(t=>{
    const subs=kids.filter(k=>String(k.parentId)===String(t.id)).map(k=>({
      sid:'b'+k.id, bxId:k.id, xmlId:k.xmlId||'',
      stage:BX.stageOf(k)||1,
      title:k.title,
      who:k.responsible&&k.responsible.id?('u'+k.responsible.id):'',
      status:BX.status(k.status),
      reactionMin:null,
      sprintId:k.sprintId?String(k.sprintId):'',
      sp:BX.marker(k).sp||0, pct:BX.marker(k).pct,
      spentH:BX.num(k.timeSpentInLogs)/3600,
      createdAt:ts(k.createdDate),
      touchedAt:ts(k.activityDate||k.changedDate||k.createdDate)
    }));
    const mk=BX.marker(t);
    const ownSprint = t.sprintId?String(t.sprintId):'';
    const kidSprint = (subs.find(s=>s.sprintId)||{}).sprintId||'';
    return {raw:t, id:'#'+t.id, bxId:t.id, xmlId:t.xmlId||'', title:t.title, cat:BX.catOf(t),
            sp:mk.sp||0, pct:mk.pct,
            groupId:t.groupId?String(t.groupId):'', sprintId:ownSprint||kidSprint,
            subs, chat:[], checks:{}, merged:false,
            createdAt:ts(t.createdDate), touchedAt:ts(t.activityDate||t.changedDate||t.createdDate)};
  });
  return parents.filter(t=>BX.num(t.parentId)>0).length;
}

/* загрузка задач проекта: родители и подзадачи разбираются из одного ответа */
async function loadPortal(){
  const t0=Date.now();
  if(!Progress.on) Progress.start('Загрузка задач портала');
  const gFilter={}; if(state.group) gFilter.GROUP_ID=Number(state.group);
  Progress.step('Запрашиваю задачи: '+(state.group?projectName(state.group):'все проекты'));

  /* спринты запрашиваем параллельно с задачами и кэшируем: повторный вход в проект их не перезапрашивает */
  state.sprintsFor=state.sprintsFor||{};
  const needSprints = state.group && !state.sprintsFor[state.group];
  if(state.group) state.sprintState=needSprints?'loading':'ok';
  const sprintsPromise = needSprints
    ? BX.loadSprints(state.group).catch(e=>{ Log.add('error','Спринты не получены: '+e.message); return null; })
    : Promise.resolve(null);

  /* первая страница задач рисуется сразу, остальные догружаются следом */
  let painted=false;
  const paintEarly=(arr)=>{
    if(painted) return; painted=true;
    buildProblems(arr);
    state.loading=false; state.live=true;
    fillUsers(); render();
    $('#mode').textContent='загружаю остальные страницы…';
  };

  if(needSprints) Progress.step('Параллельно запрашиваю спринты проекта');
  const [raw0] = await Promise.all([
    BX.loadTasks(gFilter, state.group?('проект '+state.group):'все проекты', paintEarly),
    sprintsPromise.then(list=>{
      if(list){
        state.sprints=state.sprints.filter(s=>String(s.groupId)!==String(state.group)).concat(list);
        state.sprintsFor[state.group]=Date.now();
        state.sprintState='ok';
      }else if(needSprints){ state.sprintState='error'; }
      fillSprints();
      return list;
    })
  ]);
  let raw=raw0;
  const loadMain=BX.lastLoad||{};
  Progress.step('Задачи получены: '+raw.length+' шт., страниц '+(loadMain.pages||1));

  /* добор по спринту: задача может лежать вне выбранного проекта или не поместиться в выборку */
  let addedBySprint=0;
  if(state.sprint && state.sprint!=='__backlog'){
    Progress.step('Добираю задачи выбранного спринта');
    try{
      const bySprint=await BX.loadTasks({SPRINT_ID:Number(state.sprint)}, 'спринт '+state.sprint);
      const have=new Set(raw.map(x=>String(x.id)));
      bySprint.forEach(x=>{ if(!have.has(String(x.id))){ raw.push(x); have.add(String(x.id)); addedBySprint++; } });
      Log.add('load','Добор по спринту: найдено '+bySprint.length+', добавлено новых '+addedBySprint,
              {'ID спринта':state.sprint});
    }catch(e){ Log.add('error','Добор по спринту не удался: '+e.message); }
  }

  /* родители задач-сирот: тянем их отдельно, чтобы подзадачи встали в свои заявки */
  const known=new Set(raw.map(x=>String(x.id)));
  const missingParents=[...new Set(raw.map(x=>String(x.parentId||'0'))
    .filter(pid=>pid!=='0' && !known.has(pid)))];
  if(missingParents.length){
    Progress.step('Догружаю родителей задач-сирот: '+missingParents.length);
    let par=[];
    try{
      par=await BX.loadTasks({ID:missingParents.slice(0,50)}, 'родители сирот');
    }catch(e){
      Log.add('probe','Фильтр по списку ID не принят ('+e.message+') — беру родителей пакетом');
      const ids=missingParents.slice(0,50), cmds={};
      ids.forEach(pid=>{ cmds['p'+pid]=['tasks.task.get',{taskId:Number(pid), select:taskSelect()}]; });
      try{
        const part=await BX.callBatch(cmds);
        Object.values(part).forEach(v=>{ if(v&&v.task) par.push(v.task); });
      }catch(err){ Log.add('error','Родителей получить не удалось: '+err.message); }
    }
    par.forEach(x=>{ if(!known.has(String(x.id))){ raw.push(x); known.add(String(x.id)); } });
    Log.add('load','Догружены родители сирот: запрошено '+missingParents.length+', получено '+par.length);
  }

  Progress.step('Собираю заявки и подзадачи из '+raw.length+' задач');
  const orphans=buildProblems(raw);
  Progress.step('Собрано: заявок '+state.problems.length
    +', подзадач '+state.problems.reduce((a,p)=>a+p.subs.length,0)+', сотрудников '+state.users.length);

  /* Сторипоинты грузим ФОНОМ: доска уже нарисована, числа появятся через секунду. */
  (async()=>{
    Progress.step('Сторипоинты подтягиваются фоном, доска уже работает');
    if(CONFIG.spSourceAuto && CONFIG.spSource==='marker' && !state.spProbed){
      state.spProbed=true;
      const hasMarker=state.problems.some(p=>p.sp || p.subs.some(s=>s.sp));
      if(!hasMarker){
        /* пробуем на осмысленной выборке: сперва задачи, стоящие в спринте, — оценки живут там */
        const probeIds=[], push=v=>{ if(v && probeIds.indexOf(String(v))<0) probeIds.push(String(v)); };
        state.problems.forEach(p=>{ if(p.sprintId){ push(p.bxId); p.subs.forEach(x=>push(x.bxId)); } });
        state.problems.forEach(p=>{ push(p.bxId); p.subs.forEach(x=>push(x.bxId)); });
        try{
          const pts=await BX.loadScrumPoints(probeIds.slice(0,50));
          if(Object.keys(pts).length){
            CONFIG.spSource='scrum'; Store.write();
            Log.add('load','Сторипоинты найдены в скрам-задачах ('+Object.keys(pts).length
              +' из '+Math.min(50,probeIds.length)+' проверенных) — источник переключён на scrum');
          }else Log.add('load','Сторипоинты не найдены ни в метке, ни в скрам-задачах: проверено '
              +Math.min(50,probeIds.length)+' задач');
        }catch(e){ Log.add('probe','Проверка сторипоинтов скрама не удалась: '+e.message); }
      }
    }
    if(CONFIG.spSource!=='scrum') return;
    const ids=[]; state.problems.forEach(p=>{ if(p.bxId) ids.push(String(p.bxId));
                                              p.subs.forEach(s=>{ if(s.bxId) ids.push(String(s.bxId)); }); });
    try{
      const pts=await BX.loadScrumPoints(ids);
      let hit=0;
      state.problems.forEach(p=>{
        if(pts[String(p.bxId)]){ p.sp=pts[String(p.bxId)]; hit++; }
        p.subs.forEach(s=>{ if(pts[String(s.bxId)]){ s.sp=pts[String(s.bxId)]; hit++; } });
      });
      Log.add('load','Сторипоинты проставлены фоном: '+hit+' задач');
      if(hit && state.view==='board') renderBoard();
    }catch(e){ Log.add('error','Сторипоинты не получены: '+e.message); }
  })();

  const bySprintCount={};
  state.problems.forEach(p=>{ const k=p.sprintId||'бэклог'; bySprintCount[k]=(bySprintCount[k]||0)+1; });
  Log.add('load','Загружены задачи портала: '+state.problems.length+' заявок, '
    +state.problems.reduce((a,p)=>a+p.subs.length,0)+' подзадач',
    {проект:state.group?projectName(state.group):'все', сотрудников:state.users.length,
     'сырых задач':raw.length, 'получено по проекту':loadMain.got,
     'портал сообщает всего':loadMain.total==null?'—':loadMain.total,
     страниц:loadMain.pages, 'добрано по спринту':addedBySprint,
     'сирот поднято':orphans, 'со спринтом':state.problems.filter(p=>p.sprintId).length});
  Log.add('load','Раскладка по спринтам: '+Object.entries(bySprintCount)
    .map(([k,v])=>(k==='бэклог'?k:sprintName(k))+': '+v).join(', '));
  if(loadMain.total!=null && loadMain.got<loadMain.total)
    Log.add('error','Загружены не все задачи проекта: '+loadMain.got+' из '+loadMain.total);
  if(state.sprint && state.sprint!=='__backlog'){
    const inSp=state.problems.filter(p=>inSprint(p,state.sprint));
    Log.add('load','В выбранном спринте: '+inSp.length+' заявок',
      {спринт:sprintName(state.sprint),
       'из них по своей метке':inSp.filter(p=>String(p.sprintId)===String(state.sprint)).length,
       'из них через подзадачу':inSp.filter(p=>String(p.sprintId)!==String(state.sprint)).length});
  }
  Log.add('load','Загрузка проекта заняла '+(Math.round((Date.now()-t0)/100)/10)+' с');
  Progress.step('Загрузка портала завершена за '+(Math.round((Date.now()-t0)/100)/10)+' с');
  $('#mode').textContent='портал · задач: '+state.problems.length
    +(state.group?' · '+projectName(state.group):'')
    +' · сотрудников: '+state.users.length;
  $('#mode').style.borderStyle='solid';
  Progress.modeWas=$('#mode').textContent;      // итоговую строку состояния и вернём после прогресса
}

function boot(){
  Store.apply();
  applyColors();
  applyView();
  syncTopGap();
  Prefs.apply();
  Log.load();
  const b=document.getElementById('brand');
  if(b) b.title='Версия сборки '+APP_VERSION;
  Log.add('load','Приложение открыто, версия сборки '+APP_VERSION);

  /* мгновенно показываем интерфейс: проекты из кэша, доска с индикатором загрузки */
  const cached=ProjCache.read();
  if(cached) state.projects=cached;
  if(window.BX24 && !window.__bxFail){
    state.loading=true; state.problems=[];
    fillProjects(); fillUsers(); fillSprints();
    $('#mode').textContent='подключаюсь к порталу…';
    render();
  }

  if(window.BX24 && !window.__bxFail){
    BX24.init(async()=>{
      BX.ready=true;
      const t0=Date.now();
      /* поля, пользователь и проекты — одним пакетным запросом вместо четырёх подряд */
      try{
        const b=await BX.bootData();
        if(b.me && b.me.ID) state.me={id:'u'+b.me.ID, bxId:String(b.me.ID),
          name:[b.me.NAME,b.me.LAST_NAME].filter(Boolean).join(' ')||('Сотрудник #'+b.me.ID),
          role:b.me.WORK_POSITION||'', stages:[], duties:[]};
        if(b.fields) state.taskFields=b.fields;      // список полей для конструктора карточки
        if(b.projects && b.projects.length){ state.projects=b.projects; ProjCache.write(b.projects); }
        if(b.fields && (!CONFIG.pctField || !CONFIG.spField)){
          const found={};
          Object.entries(b.fields).forEach(([name,d])=>{
            if(!/^UF_/.test(name)) return;
            const title=String((d&&d.title)||'').toLowerCase();
            if(!found.pct && /процент|percent|готовн/.test(title)) found.pct=name;
            if(!found.sp && /стори|story|поинт|point|оценк/.test(title)) found.sp=name;
          });
          if(!CONFIG.pctField && found.pct){ CONFIG.pctField=found.pct; Store.write();
            Log.add('load','Подобрано поле процента готовности: '+found.pct); }
          if(!CONFIG.spField && found.sp && CONFIG.spSource==='field'){ CONFIG.spField=found.sp; Store.write();
            Log.add('load','Подобрано поле сторипоинтов: '+found.sp); }
        }
        Log.add('load','Стартовый пакет получен за '+(Date.now()-t0)+' мс');
      }catch(e){
        Log.add('error','Стартовый пакет не получен: '+e.message+' — беру данные по одному');
        try{ const projects=await BX.loadProjects(); if(projects.length){ state.projects=projects; ProjCache.write(projects); } }catch(err){}
        try{ const me=await BX.call('user.current',{});
             if(me&&me.ID) state.me={id:'u'+me.ID, bxId:String(me.ID),
               name:[me.NAME,me.LAST_NAME].filter(Boolean).join(' '), role:me.WORK_POSITION||'', stages:[], duties:[]};
        }catch(err){}
      }

      if(!state.group && CONFIG.groupId) state.group=String(CONFIG.groupId);
      if(state.group && !state.projects.some(g=>String(g.id)===String(state.group))) state.group='';
      CONFIG.groupId=state.group?Number(state.group):CONFIG.groupId;
      fillProjects();
      state.sprintState=state.group?'loading':'ok';
      fillSprints();
      $('#mode').textContent='загружаю задачи…';

      try{
        await loadPortal();
        state.live=true;
      }catch(e){ console.error('[задачи]',e); Log.add('error','Не удалось загрузить задачи: '+e.message);
        $('#mode').textContent='нет доступа к задачам: '+e.message; }
      state.loading=false;
      fillUsers(); fillSprints();
      render();
      Log.add('load','Приложение готово за '+(Math.round((Date.now()-t0)/100)/10)+' с');
      BX24.fitWindow && BX24.fitWindow();
    });
  }else{
    state.loading=false;
    if(state.group && !state.projects.some(g=>String(g.id)===String(state.group))) state.group='';
    fillProjects(); fillUsers(); fillSprints();
    $('#mode').textContent='демо-режим, вне портала';
    render();
  }
}
boot();
</script>
</body>
</html>
